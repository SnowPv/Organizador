<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FB">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Organizador</title>
<style>
:root{
  --bg:#F6F5FB; --card:#FFFFFF; --ink:#1B1A2E; --muted:#7E7F92; --line:#ECEBF3; --soft:#F2F0FA;
  --accent:#6D5DFC; --pink:#FF5C8A; --amber:#FFB547; --ok:#13B386; --warn:#F5A524; --bad:#F04461; --info:#3B9EFF;
  --ok-ink:#0B8A66; --warn-ink:#A86A00; --bad-ink:#D42A49; --info-ink:#1F6FD1; --accent-ink:#5546E8;
  --trabajo:#6D5DFC; --personal:#FF5C8A;
  --grad:linear-gradient(135deg,#6D5DFC 0%,#A44DF0 48%,#FF5C8A 100%);
  --grad-warm:linear-gradient(135deg,#FF8A4C 0%,#FF5C8A 100%);
  --grad-cool:linear-gradient(135deg,#3B9EFF 0%,#6D5DFC 100%);
  --grad-green:linear-gradient(135deg,#13B386 0%,#3FD2A8 100%);
  --shadow-sm:0 1px 2px rgba(27,26,46,.05), 0 2px 8px -4px rgba(27,26,46,.08);
  --shadow-md:0 10px 30px -10px rgba(27,26,46,.22);
  --shadow-fab:0 12px 26px -8px rgba(164,77,240,.65);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
main{padding-bottom:24px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 72%, transparent);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}
header.top small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow-sm);width:40px;height:40px;border-radius:13px;font-size:17px;color:var(--ink)}
.chip-off{background:rgba(245,165,36,.16);color:var(--warn-ink);border-radius:999px;padding:3px 10px;font-size:11px;margin-left:8px;font-weight:700;vertical-align:middle}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow-sm)}
.card h2{font-size:13px;letter-spacing:.02em;color:var(--ink);margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .ct{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.card h2 .em{font-size:17px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.link{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:13.5px;padding:8px 0 0}

/* héroe */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px;margin:6px 0 12px;box-shadow:0 18px 36px -18px rgba(164,77,240,.8);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-size:14px;font-weight:600;opacity:.9}
.hero .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px;line-height:1.2}
.hero .in{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ring b span{font-size:11px;font-weight:700;opacity:.85}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.hstat{background:rgba(255,255,255,.18);border-radius:15px;padding:8px 10px;backdrop-filter:blur(4px)}
.hstat b{display:block;font-size:17px;font-weight:800}
.hstat span{font-size:11px;font-weight:600;opacity:.9}
.lvl{position:relative;z-index:1;margin-top:12px}
.lvl .bar{background:rgba(255,255,255,.25)}
.lvl .bar i{background:#fff}
.lvl small{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.92;margin-top:5px}

/* fichas de colores */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:18px;padding:10px 8px;color:#fff;text-align:left;border:0;box-shadow:var(--shadow-sm)}
.tile .ic{font-size:17px;display:block}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:2px;line-height:1.1}
.tile span{font-size:10.5px;font-weight:700;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border-radius:18px;padding:11px;box-shadow:var(--shadow-sm);border-top:4px solid var(--c,var(--accent))}
.kpi b{font-size:21px;display:block;font-weight:800;letter-spacing:-.01em}.kpi span{font-size:11px;color:var(--muted);font-weight:700}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar u{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.45}

/* tareas */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--q,#C9C8D6);background:color-mix(in srgb, var(--q,#C9C8D6) 10%, transparent);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;transition:transform .15s,background .15s;padding:0}
.chk:active{transform:scale(.85)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.task .t{font-weight:650;line-height:1.3;word-break:break-word;letter-spacing:-.005em}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .why{font-size:12px;color:var(--accent-ink);font-weight:700;margin-top:3px}
.play{flex:none;border:0;width:34px;height:34px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--accent-ink)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.tag.bad{background:rgba(240,68,97,.14);color:var(--bad-ink)}.tag.warn{background:rgba(245,165,36,.17);color:var(--warn-ink)}.tag.ok{background:rgba(19,179,134,.15);color:var(--ok-ink)}.tag.info{background:rgba(59,158,255,.14);color:var(--info-ink)}
.empty{text-align:center;color:var(--muted);padding:22px 6px;font-size:14px;font-weight:500;line-height:1.5}

/* navegación */
nav.bottom{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--card) 92%, transparent);backdrop-filter:blur(12px);border-radius:24px;padding:6px 4px;display:flex;justify-content:space-around;z-index:8;box-shadow:var(--shadow-md);border:1px solid var(--line);max-width:720px;margin:0 auto}
nav.bottom button{flex:1;min-width:0;border:0;background:none;padding:4px 0;color:var(--muted);font-size:9.5px;font-weight:700;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button span{display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;width:38px;height:30px;border-radius:12px;filter:grayscale(.6);opacity:.75;transition:all .2s}
nav.bottom button.on{color:var(--accent-ink)}
nav.bottom button.on span{background:var(--soft);filter:none;opacity:1;transform:translateY(-1px)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--grad);color:#fff;font-size:32px;font-weight:300;line-height:1;box-shadow:var(--shadow-fab);z-index:9;transition:transform .12s}
.fab:active{transform:scale(.92)}
.focus-pill{position:fixed;left:16px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:9;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13.5px;padding:10px 14px;box-shadow:var(--shadow-md);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* formularios */
.seg{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=password],select,textarea{width:100%;padding:13px 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.l{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.btn{border:0;border-radius:15px;padding:14px 16px;font-weight:800;background:var(--grad);color:#fff;font-size:15.5px;box-shadow:0 6px 16px -6px rgba(164,77,240,.6)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.bad{background:transparent;color:var(--bad-ink);box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;margin-top:18px}.btns .btn{flex:1}
.backdrop{position:fixed;inset:0;background:rgba(15,14,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s ease}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet::before{content:"";display:block;width:48px;height:5px;background:#D6D4E3;border-radius:99px;margin:4px auto 12px}
.sheet-x{position:sticky;top:0;float:right;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--muted);font-size:17px;font-weight:800;margin:-6px -6px 0 8px;box-shadow:var(--shadow-sm)}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:15px;z-index:40;font-size:14px;font-weight:700;max-width:88%;box-shadow:var(--shadow-md)}
.hint{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.45}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* agregar inteligente */
.smart{display:flex;gap:8px;align-items:center}
.smart input{font-size:17px;font-weight:600}
.mic{flex:none;width:50px;height:50px;border-radius:15px;border:0;background:var(--soft);font-size:21px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(240,68,97,.2)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}
.chip{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--ink);border:0}
.preview{font-size:13px;color:var(--muted);margin-top:8px}
.preview b{color:var(--ink)}
details.more{margin-top:12px;background:var(--card);border-radius:18px;padding:4px 14px 14px;box-shadow:var(--shadow-sm)}
details.more summary{list-style:none;font-weight:800;font-size:14px;padding:12px 0 2px;color:var(--accent-ink)}
details.more summary::-webkit-details-marker{display:none}
.quick{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);color:var(--muted);font-weight:600;border:0;width:100%;text-align:left;margin-top:12px}
.quick b{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}

/* asistente, agenda, semana */
.ins{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ins:first-of-type{border-top:0}
.ins .ic{flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ins .tx{font-size:14px;line-height:1.4;font-weight:550}
.ins .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ev{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.ev:first-of-type{border-top:0}
.ev .hr{flex:none;width:54px;font-weight:800;font-size:13px}
.ev .dot{flex:none;width:4px;align-self:stretch;border-radius:4px}
.ev.now{background:color-mix(in srgb, var(--accent) 8%, transparent);border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:0;border-radius:16px;padding:8px 2px;background:var(--soft);text-align:center;color:var(--ink)}
.wd small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase}
.wd b{display:block;font-size:17px;font-weight:800;margin:1px 0}
.wd i{display:block;height:6px;border-radius:9px;margin:4px 8px 0;background:var(--line)}
.wd.today{background:var(--grad);color:#fff}.wd.today small{color:#fff;opacity:.9}
.wd.busy{background:repeating-linear-gradient(135deg,#EFEAFE 0 6px,#E4DDFD 6px 12px)}
.wd.today.busy{background:var(--grad)}
.busy-band{position:relative;z-index:1;background:rgba(255,255,255,.22);border-radius:14px;padding:8px 11px;font-size:13.5px;font-weight:700;margin:-4px 0 12px}
.sug{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.sug:first-of-type{border-top:0}
.sug .ic{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--soft)}
.sug .tt{font-weight:700;font-size:14.5px;line-height:1.3;word-break:break-word}
.sug .st{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.sq{flex:none;border:0;width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:800}
.sq.add{background:var(--grad);color:#fff}.sq.no{background:var(--soft);color:var(--muted)}

/* estadísticas */
.hb{margin:10px 0}.hb .n{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:600;gap:8px}
.hb .b{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.hb .b i{display:block;height:100%}
svg text{fill:var(--muted);font-size:9px;font-weight:600}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.badge{flex:none;width:76px;text-align:center;padding:10px 4px;border-radius:18px;background:var(--soft);opacity:.55}
.badge.on{opacity:1;background:var(--card);box-shadow:0 8px 18px -8px rgba(164,77,240,.5)}
.badge .ic{font-size:27px;display:block;margin-bottom:4px}
.badge .nm{font-size:10px;font-weight:800;line-height:1.2}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{border-radius:18px;padding:12px;color:#fff;border:0;text-align:left}
.qc b{font-size:24px;display:block;font-weight:800}
.qc span{font-size:11.5px;font-weight:700;opacity:.95;display:block;margin-top:2px}
.qbox{border-radius:18px;padding:10px 12px;margin:8px 0;border:2px solid var(--qc)}
.qbox h4{margin:0 0 4px;font-size:13px;color:var(--qc);font-weight:800}
.stats-toggle{width:100%;border:0;background:var(--card);border-radius:18px;padding:14px;font-weight:800;color:var(--ink);box-shadow:var(--shadow-sm);margin-top:12px;display:flex;justify-content:space-between;align-items:center}

/* tablero */
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.filters .pill{flex:none;white-space:nowrap}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:15px;margin:10px 0 2px}
.views button{border:0;background:none;border-radius:11px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--muted)}
.views button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.board{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.col{flex:none;width:78%;max-width:300px;background:var(--soft);border-radius:20px;padding:10px;scroll-snap-align:start}
.col h4{margin:2px 4px 8px;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.kc{background:var(--card);border-radius:15px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow-sm);border-left:4px solid var(--c)}
.kc .t{font-weight:700;font-size:14px;line-height:1.3}
.kc .mv{display:flex;justify-content:space-between;margin-top:8px}
.kc .mv button{white-space:nowrap;border:0;background:var(--soft);border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;color:var(--ink)}

/* hábitos y semana */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.heat i{display:block;padding-top:100%;border-radius:5px;background:var(--soft)}
.heat i.today{box-shadow:0 0 0 2px var(--ink) inset}
.habit-row{padding:14px 0;border-top:1px solid var(--line)}
.habit-row:first-of-type{border-top:0}
.habit-dot{width:34px;height:34px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px}
.checklist-item{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.checklist-item:first-of-type{border-top:0}
.checklist-item.done .ct{text-decoration:line-through;color:var(--muted)}
.weekcard{border-radius:16px;padding:12px;background:var(--soft);margin:8px 0}
textarea.note{min-height:56px;resize:vertical}
.proj{border-left:5px solid var(--c)}

/* base de contactos */
.ct-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ct-row:first-of-type{border-top:0}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.02em}
.ct-last{flex:none;text-align:right;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.35}
.tl{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.tl:first-of-type{border-top:0}
.tl .ic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:15px}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts3 a,.acts3 button{text-align:center;text-decoration:none;border:0;border-radius:14px;padding:11px 4px;background:var(--soft);color:var(--ink);font-weight:800;font-size:13px}
/* negociaciones */
.stages{display:flex;gap:2px;margin:12px 0 8px}
.stages button{flex:1;min-width:0;border:0;padding:9px 0 9px 6px;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--soft);clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%,14% 50%);white-space:nowrap;overflow:hidden}
.stages button:first-child{clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);padding-left:0}
.stages button.ok{background:color-mix(in srgb,var(--c) 30%,white);color:var(--ink)}
.stages button.on{background:var(--c);color:#fff}
.hd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.fun{display:flex;flex-direction:column;align-items:center;gap:2px}
.fun .fr{border-radius:12px;color:#fff;padding:8px 10px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;gap:6px;min-width:150px;box-sizing:border-box}
.fun .cv{font-size:11px;color:var(--muted);font-weight:800}
.mbar{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}
.mbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted);font-weight:700}
.mbar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--grad-green);min-height:3px}
.rec{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .ic{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:800;color:var(--ink)}
.deal{padding:12px 0;border-top:1px solid var(--line)}
.deal:first-of-type{border-top:0}
/* foco */
.timer{position:relative;width:220px;height:220px;margin:14px auto}
.timer b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer b span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:50;border-radius:2px;pointer-events:none;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.2}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="hTitle">Organizador</h1><small id="hSub"></small></div>
    <div class="row" style="gap:8px">
      <button class="icon-btn" id="btnRefresh" title="Actualizar">↻</button>
      <button class="icon-btn" id="btnSettings" title="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Agregar tarea">+</button>
<button class="focus-pill" id="focusPill" hidden></button>
<nav class="bottom">
  <button data-tab="inicio"><span>🏠</span>Inicio</button>
  <button data-tab="hoy"><span>☀️</span>Hoy</button>
  <button data-tab="tareas"><span>📋</span>Tareas</button>
  <button data-tab="habitos"><span>💪</span>Hábitos</button>
  <button data-tab="negocios"><span>🤝</span>Negocios</button>
  <button data-tab="proy"><span>🚀</span>Proyectos</button>
  <button data-tab="base"><span>📇</span>Base</button>
</nav>
<div id="layer"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const LS = window.localStorage;
let S = { data: null, tab: 'inicio', filtro: 'todas', q: '', verHechas: false, vista: LS.vista || 'lista', offline: false, busy: false, google: null, googleBusy: false, googleAt: 0, ext: null, extInactivo: false, base: null, baseAt: 0, bf: 'todos', bq: '', mutado: false, subH: 'habitos', neg: null, negAt: 0, nv: LS.nv || 'resumen', nf: 'abiertas', nq: '' };
let deferredInstall = null;

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pd(s){ return new Date(s + 'T12:00:00'); }
function addDays(s, n){ const d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function diffDays(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function fmt(s){ if(!s) return 'Sin fecha'; const d = pd(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; }
function fmtRel(s){ const n = diffDays(hoy(), s); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n === -1 ? 'Ayer' : fmt(s); }
function fmtLong(s){ const d = pd(s); return DIAS_L[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES_L[d.getMonth()]; }
function hoy(){ return iso(new Date()); }
function toast(msg){ $$('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function pct(x){ return Math.round((x || 0) * 100); }
function norm(s){ return String(s || '').toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n'); }
const PALETTE = ['#6D5DFC','#FF5C8A','#13B386','#FFB547','#3B9EFF','#C04FE0','#FF8A4C','#20B8B0','#E04FA0','#5C8DFF'];
function paletteColor(s){ s = String(s||''); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
function hexToRgba(hex, a){ const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
function params(){ return (S.data.config && S.data.config.params) || {}; }
function metaDiaria(){ return +params()['Meta diaria de tareas'] || 6; }
function indicador(prefijo){ const ind = S.data.indicadores || {}; const k = Object.keys(ind).find(k => k.startsWith(prefijo)); return k ? ind[k] : undefined; }
function vibrar(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function lsGet(k, def){ try { return JSON.parse(LS[k]) || def; } catch(e){ return def; } }
function lsSet(k, v){ try { LS[k] = JSON.stringify(v); } catch(e){} }

/* colores y símbolos */
const CAT_IC = { 'Ventas':'💰', 'Eventos':'🎪', 'Capacitaciones':'🎓', 'Marketing':'📣', 'Salidas con clientes':'🚵', 'Futuros proyectos':'🔭', 'Administración':'🗂️', 'Salud':'🩺', 'Finanzas':'💳', 'Hogar':'🏡', 'Aprendizaje':'📚', 'Familia y amigos':'👨‍👩‍👧' };
const AREA_IC = { 'Trabajo':'💼', 'Personal':'🌿' };
const AREA_COL = { 'Trabajo':'#6D5DFC', 'Personal':'#FF5C8A' };
const EST_IC = { 'Pendiente':'⏳', 'En curso':'🔄', 'Esperando respuesta':'⌛', 'Pausada':'⏸️' };
const QUAD = { 1: { c:'#F04461', n:'Hacer ya', ic:'🔥' }, 2: { c:'#3B9EFF', n:'Planificar', ic:'🗓️' }, 3: { c:'#FFB547', n:'Delegar', ic:'🤝' }, 4: { c:'#A3A2B5', n:'Posponer', ic:'💤' } };
const HAB_IC = [['ejercicio','🏃'],['bici','🚵'],['leer','📖'],['estudi','🧠'],['agua','💧'],['agenda','🗓️'],['pantalla','📵'],['dormir','😴'],['medit','🧘'],['comer','🥗']];
function catIc(c){ return CAT_IC[c] || '🏷️'; }
function areaCol(a){ return AREA_COL[a] || paletteColor(a); }
function catCol(c){ return paletteColor(c); }
function quadOf(t){ const n = parseInt(t.cuadrante); if (QUAD[n]) return n; return t.urgente === 'Sí' && t.importante === 'Sí' ? 1 : t.importante === 'Sí' ? 2 : t.urgente === 'Sí' ? 3 : 4; }
function habIc(n){ const k = norm(n); const m = HAB_IC.find(x => k.includes(x[0])); return m ? m[1] : '✨'; }

/* ---------- API ---------- */
const OPS_CAMBIO = ['subtareas', 'repetir', 'siguiente'];
async function api(action, extra){
  if (['add', 'update', 'toggle', 'delete'].includes(action) || (action === 'extra' && OPS_CAMBIO.includes(extra && extra.op))) S.mutado = true;
  const res = await fetch(LS.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: LS.token, action }, extra || {})) });
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('respuesta'); }
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
function apiX(op, extra){ return api('extra', Object.assign({ op }, extra || {})); }
// Nivel 2 del script Extras: recordatorios y base de contactos. Nivel 3: la base solo usa contacto@blacklinechile.cl. Nivel 4: eventos de varios días.
function extNivel(){ return S.extInactivo ? 0 : (S.ext && S.ext.nivel) || 1; }
function necesitaActualizar(){ return !S.extInactivo && S.ext && extNivel() < 5; }
let sincTimer = null;
// Después de cambiar tareas, el script actualiza los recordatorios del calendario (en segundo plano).
function sincPronto(){
  if (extNivel() < 2) return;
  clearTimeout(sincTimer);
  sincTimer = setTimeout(() => apiX('sinc').catch(() => {}), 2500);
}
async function loadBase(forzar){
  if (extNivel() < 2) return;
  if (!forzar && S.base && Date.now() - S.baseAt < 10 * 60000) return;
  try { const b = await apiX('base'); S.base = b; S.baseAt = Date.now(); lsSet('baseCache', b); }
  catch(e){ if (!S.base) S.base = lsGet('baseCache', null); }
}
const REPETIR = ['Diaria', 'Días hábiles', 'Semanal', 'Quincenal', 'Mensual', 'Anual'];
function parseSub(txt){ return String(txt || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => ({ ok: /^(☑|\[x\])/i.test(l), t: l.replace(/^(☑|☐|\[x\]|\[ \]|-)\s*/i, '') })).filter(x => x.t); }
// Subtareas y repetición viven en las columnas U y V; se leen aparte y se unen a cada tarea por fila.
function applyExtras(){
  if (!S.data) return;
  const m = {}; ((S.ext && S.ext.filas) || []).forEach(f => { m[f.row] = f; });
  S.data.tareas.forEach(t => { if (t.row == null) return; const f = m[t.row]; t.subtareas = f ? parseSub(f.sub) : []; t.repetir = f ? f.rep : ''; });
}
async function loadExtras(){
  if (!LS.url) return;
  try { S.ext = await apiX('extras'); S.extInactivo = false; lsSet('extCache', S.ext); }
  catch(e){ if (/accion desconocida/i.test(e.message)) S.extInactivo = true; else if (!S.ext) S.ext = lsGet('extCache', null); }
  applyExtras();
}
async function load(){
  S.busy = true; head();
  const antes = S.data ? +((S.data.indicadores || {})['Nivel']) || 0 : 0;
  try {
    S.data = await api('state'); LS.cache = JSON.stringify(S.data); S.offline = false;
    const ahora = +((S.data.indicadores || {})['Nivel']) || 0;
    if (antes && ahora > antes){ confetti(80); toast('🏅 ¡Subiste a nivel ' + ahora + ' · ' + ((S.data.indicadores || {})['Nombre del nivel'] || '') + '!'); }
  } catch(e){
    if (e.message === 'auth'){ toast('La clave no coincide'); S.busy = false; return showSetup(); }
    S.offline = true;
    if (!S.data && LS.cache) S.data = JSON.parse(LS.cache);
  }
  applyExtras();
  S.busy = false; render();
  loadExtras().then(async () => {
    if (S.mutado){ S.mutado = false; sincPronto(); }
    await loadBase(false);
    await loadNeg(false);
    if (!$('#layer').innerHTML) render();
  });
  loadGoogle(false);
}
// Calendario y Gmail (vía Extras): se piden aparte para no hacer más lenta la carga principal.
async function loadGoogle(forzar){
  if (!LS.url || S.googleBusy) return;
  if (!forzar && S.google && Date.now() - S.googleAt < 10 * 60000) return;
  S.googleBusy = true;
  try { const g = await apiX('google'); S.google = g; S.googleAt = Date.now(); lsSet('googleCache', g); }
  catch(e){
    if (/accion desconocida/i.test(e.message)){ S.google = { inactivo: true }; S.googleAt = Date.now(); }
    else if (!S.google) S.google = lsGet('googleCache', null);
  }
  S.googleBusy = false;
  if (S.tab === 'inicio' && !$('#layer').innerHTML) render();
}
async function updateTask(t, cambios){
  const campos = Object.assign({ nuevoTexto: t.tarea, estado: t.estado || 'Pendiente', limite: t.limite || '', urgente: t.urgente || 'No', importante: t.importante || 'No', tamano: t.tamano || '', notas: t.notas || '' }, cambios);
  return api('update', { row: t.row, tarea: t.tarea, campos });
}

/* ---------- cabecera y navegación ---------- */
const TITLES = { inicio: 'Inicio', hoy: 'Hoy', tareas: 'Tareas', habitos: 'Hábitos', semana: 'Semana', proy: 'Proyectos', base: 'Base de datos', negocios: 'Negociaciones' };
function head(){
  $('#hTitle').innerHTML = (S.tab === 'habitos' && S.subH === 'semana' ? 'Semana' : TITLES[S.tab]) + (S.offline ? '<span class="chip-off">sin conexión</span>' : '');
  $('#hSub').innerHTML = S.busy ? '<span class="spin"></span>Actualizando…' : fmtLong(hoy());
  $$('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
}
function go(tab){ S.tab = tab; render(); window.scrollTo(0, 0); }
$$('nav.bottom button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#btnRefresh').onclick = () => { load(); loadGoogle(true); };
$('#btnSettings').onclick = () => showSettings();
$('#fab').onclick = () => { try { openAdd(); } catch(e){ toast('No se pudo abrir el formulario: ' + e.message); } };

function render(){
  head();
  if (!S.data){ $('#view').innerHTML = '<div class="empty"><span class="spin"></span>Cargando…</div>'; return; }
  ({ inicio: viewInicio, hoy: viewHoy, tareas: viewTareas, habitos: () => S.subH === 'semana' ? viewSemana() : viewHabitos(), semana: viewSemana, proy: viewProy, base: viewBase, negocios: viewNegocios })[S.tab]();
  focusPill();
}

/* ---------- lógica: listas y prioridad inteligente ---------- */
function pendientes(){ return S.data.tareas.filter(t => !t.hecho); }
function hechasEl(dia){ return S.data.tareas.filter(t => t.hecho && (t.cierre || '').slice(0, 10) === dia); }
function vencidas(){ const h = hoy(); return pendientes().filter(t => t.limite && t.limite < h); }
function paraHoy(){ const h = hoy(); return pendientes().filter(t => (t.limite && t.limite <= h) || t.estado === 'En curso'); }
function ordenar(a, b){
  const ca = quadOf(a), cb = quadOf(b);
  if (ca !== cb) return ca - cb;
  return (a.limite || '9999').localeCompare(b.limite || '9999');
}
// Puntaje: mezcla vencimiento, cuadrante de Eisenhower y estado para sugerir qué hacer primero.
function puntaje(t){
  const h = hoy(); let s = 0, why = '';
  if (t.limite){
    const d = diffDays(h, t.limite);
    if (d < 0){ s += 50 + Math.min(30, -d * 4); why = 'Vencida hace ' + (-d) + (d === -1 ? ' día' : ' días'); }
    else if (d === 0){ s += 42; why = 'Vence hoy'; }
    else if (d === 1){ s += 16; why = 'Vence mañana'; }
    else if (d <= 3){ s += 8; why = 'Vence ' + fmt(t.limite); }
  }
  const q = quadOf(t); s += { 1: 32, 2: 18, 3: 10, 4: 0 }[q];
  if (!why && q === 1) why = 'Urgente e importante';
  if (t.estado === 'En curso'){ s += 22; why = why || 'Ya la empezaste'; }
  if (t.estado === 'Esperando respuesta' || t.estado === 'Pausada') s -= 45;
  const hr = new Date().getHours();
  if (hr < 12 && t.tamano === 'Grande') s += 5;
  if (hr >= 16 && t.tamano === 'Pequeña'){ s += 5; why = why || 'Rápida para cerrar el día'; }
  if (!why) why = q === 2 ? 'Importante: avanza antes de que sea urgente' : 'Buen momento para sacarla';
  return { s, why };
}
// Días ocupados: eventos de día completo (o de 5 horas o más) en tu calendario, como una capacitación.
function minutosHHMM(t){ const p = String(t || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function ocupados(){
  const m = {}, g = S.google;
  if (!g || !g.eventos) return m;
  g.eventos.forEach(e => {
    const largo = e.todoElDia || (e.inicio && e.fin && minutosHHMM(e.fin) - minutosHHMM(e.inicio) >= 300);
    if (!largo) return;
    let d = e.fecha; const fin = e.fechaFin || e.fecha;
    for (let i = 0; i < 31 && d <= fin; i++){ if (!m[d]) m[d] = e; d = addDays(d, 1); }
  });
  return m;
}
function proximoLibre(desde){
  const oc = ocupados(); let d = addDays(desde, 1);
  for (let i = 0; i < 30; i++){ if (!oc[d] && pd(d).getDay() !== 0) return d; d = addDays(d, 1); }
  return addDays(desde, 1);
}
// Tareas no urgentes que caen en un día ocupado (hoy incluye las vencidas).
function tareasEnDiaOcupado(d){ const h = hoy(); return pendientes().filter(t => quadOf(t) !== 1 && t.estado !== 'En curso' && (t.limite === d || (d === h && t.limite && t.limite < h))); }
function enfoque(n){ return pendientes().map(t => Object.assign({ t }, puntaje(t))).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, n); }

/* ---------- componentes ---------- */
function tagFecha(t){
  if (t.hecho) return '<span class="tag ok">✅ Hecha</span>';
  if (!t.limite) return '';
  const h = hoy();
  if (t.limite < h) return '<span class="tag bad">⏰ Vencida · ' + fmt(t.limite) + '</span>';
  if (t.limite === h) return '<span class="tag warn">☀️ Hoy</span>';
  if (t.limite === addDays(h, 1)) return '<span class="tag info">📅 Mañana</span>';
  return '<span class="tag">📅 ' + fmt(t.limite) + '</span>';
}
function taskHTML(t, opt){
  opt = opt || {};
  const idx = S.data.tareas.indexOf(t), q = QUAD[quadOf(t)];
  const cc = t.categoria ? catCol(t.categoria) : null;
  return '<div class="task ' + (t.hecho ? 'done' : '') + '">' +
    '<button class="chk ' + (t.hecho ? 'on' : '') + '" style="--q:' + q.c + '" data-tog="' + idx + '" aria-label="Marcar">' + (t.hecho ? '✓' : '') + '</button>' +
    '<div class="grow" data-open="' + idx + '"><div class="t">' + esc(t.tarea) + '</div>' +
    (opt.why ? '<div class="why">✨ ' + esc(opt.why) + '</div>' : '') +
    (opt.compact ? '' : '<div class="meta">' + tagFecha(t) +
      (t.area ? '<span class="tag" style="background:' + hexToRgba(areaCol(t.area), .13) + ';color:' + areaCol(t.area) + '">' + (AREA_IC[t.area] || '') + ' ' + esc(t.area) + '</span>' : '') +
      (t.categoria ? '<span class="tag" style="background:' + hexToRgba(cc, .13) + ';color:' + cc + '">' + catIc(t.categoria) + ' ' + esc(t.categoria) + '</span>' : '') +
      (t.proyecto ? '<span class="tag">🚀 ' + esc(t.proyecto) + '</span>' : '') +
      subTag(t) + (t.repetir ? '<span class="tag info">🔁 ' + esc(t.repetir) + '</span>' : '') +
      (t.estado && t.estado !== 'Pendiente' && !t.hecho ? '<span class="tag">' + (EST_IC[t.estado] || '') + ' ' + esc(t.estado) + '</span>' : '') +
      '</div>') +
    '</div>' + (!t.hecho && opt.play ? '<button class="play" data-focus="' + idx + '" aria-label="Enfocar">▶</button>' : '') + '</div>';
}
function subTag(t){
  const L = t.subtareas || []; if (!L.length) return '';
  const n = L.filter(x => x.ok).length;
  return '<span class="tag ' + (n === L.length ? 'ok' : '') + '">☑ ' + n + '/' + L.length + '</span>';
}
function bindTasks(root){
  root.querySelectorAll('[data-tog]').forEach(b => b.onclick = e => { e.stopPropagation(); toggle(S.data.tareas[+b.dataset.tog]); });
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(S.data.tareas[+b.dataset.open]));
  root.querySelectorAll('[data-focus]').forEach(b => b.onclick = e => { e.stopPropagation(); openFocus(S.data.tareas[+b.dataset.focus]); });
}
function ring(p, color, track, size){
  size = size || 96; const r = size * .4, c = 2 * Math.PI * r, w = size * .1;
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '"><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (track || 'var(--soft)') + '" stroke-width="' + w + '"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (color || 'var(--ok)') + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + (c * Math.min(1, p)).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')" style="transition:stroke-dasharray .5s"/></svg>';
}
function card(titulo, em, cuerpo, extra){ return '<div class="card"><h2><span class="em">' + em + '</span>' + titulo + (extra ? '<span class="ct">' + extra + '</span>' : '') + '</h2>' + cuerpo + '</div>'; }

function heroHTML(){
  const h = hoy(), lista = paraHoy(), hechas = hechasEl(h);
  const total = lista.length + hechas.length, p = total ? hechas.length / total : 0;
  const ind = S.data.indicadores || {}, nombre = params()['Tu nombre (para el saludo)'];
  const hr = new Date().getHours(), saludo = hr < 12 ? 'Buenos días' : hr < 20 ? 'Buenas tardes' : 'Buenas noches';
  const racha = indicador('Racha') || 0, puntos = ind['Puntos totales'] || 0, nivel = ind['Nombre del nivel'] || '–';
  const enNivel = +ind['Puntos dentro del nivel actual'] || 0, paraNivel = +params()['Puntos para subir de nivel'] || 100;
  const meta = metaDiaria(), faltan = Math.max(0, meta - hechas.length);
  const oc = ocupados()[h];
  const frase = oc ? (lista.some(t => quadOf(t) === 1) ? 'Día ocupado: haz solo lo urgente 🔥' : 'Día ocupado: hoy no te exijas más 🙌') : !total ? 'Día despejado. ¿Qué quieres lograr hoy?' : hechas.length >= meta ? '¡Meta cumplida! Eres imparable 🚀' : p >= .5 ? 'Vas muy bien, sigue así 💪' : faltan === 1 ? 'Te falta 1 tarea para tu meta 🎯' : 'Te faltan ' + faltan + ' tareas para tu meta 🎯';
  return '<div class="hero"><div class="hi">' + esc(saludo) + (nombre ? ', ' + esc(nombre) : '') + ' 👋</div><div class="big">' + frase + '</div>' +
    (oc ? '<div class="busy-band">🔒 Hoy: ' + esc(oc.titulo) + (oc.todoElDia ? ' · todo el día' : ' · ' + esc(oc.inicio) + '–' + esc(oc.fin)) + '</div>' : '') +
    '<div class="in"><div class="ring">' + ring(p, '#fff', 'rgba(255,255,255,.25)') + '<b>' + hechas.length + '<span>de ' + total + ' hoy</span></b></div>' +
    '<div class="hstats"><div class="hstat"><b>🔥 ' + esc(racha) + '</b><span>racha (días)</span></div><div class="hstat"><b>⭐ ' + esc(puntos) + '</b><span>puntos</span></div>' +
    '<div class="hstat"><b>🎯 ' + hechas.length + '/' + meta + '</b><span>meta diaria</span></div><div class="hstat"><b>🏅 ' + esc(nivel) + '</b><span>nivel ' + esc(ind['Nivel'] || 1) + '</span></div></div></div>' +
    '<div class="lvl"><div class="bar"><i style="width:' + Math.min(100, Math.round(enNivel / paraNivel * 100)) + '%"></i></div><small><span>' + enNivel + ' / ' + paraNivel + ' pts</span><span>siguiente nivel</span></small></div></div>';
}

function agendaHTML(){
  const g = S.google, h = hoy();
  if (!g) return card('Agenda de hoy', '📅', '<div class="empty"><span class="spin"></span>Revisando tu calendario…</div>');
  if (g.inactivo) return card('Activa las funciones extra', '✨', '<div class="hint" style="margin-top:0">📅 Tu agenda de Google Calendar aquí · ✉️ correos destacados como tareas · ☑ subtareas · 🔁 tareas que se repiten. Se activa una vez en tu Apps Script.</div><button class="btn sm" id="gAct">Cómo activarlo</button>');
  const ev = (g.eventos || []).filter(e => e.fecha === h);
  const ahora = new Date().toTimeString().slice(0, 5);
  const lista = ev.length ? ev.map(e => {

      '<div class="hint" style="margin:2px 0 0">' + (now ? '🟢 Ahora · ' : '') + (e.fin ? 'hasta ' + esc(e.fin) : '') + (e.lugar ? ' · 📍 ' + esc(e.lugar) : '') + '</div></div></div>';

}

function semanaStripHTML(){
  const h = hoy(), P = pendientes(), meta = metaDiaria();
  let s = '<div class="week">';
  for (let i = 0; i < 7; i++){
    const d = addDays(h, i), n = P.filter(t => t.limite === d).length + (i === 0 ? vencidas().length : 0);
    const ev = S.google && S.google.eventos ? S.google.eventos.filter(e => e.fecha === d).length : 0;
    const col = n === 0 ? 'var(--line)' : n > meta ? 'var(--bad)' : n >= meta * .6 ? 'var(--warn)' : 'var(--ok)';
    const oc = ocupados()[d];
    s += '<button class="wd ' + (i === 0 ? 'today ' : '') + (oc ? 'busy' : '') + '" data-day="' + d + '"' + (oc ? ' title="' + esc(oc.titulo) + '"' : '') + '><small>' + DIAS[pd(d).getDay()] + '</small><b>' + pd(d).getDate() + '</b><span style="font-size:11px;font-weight:700">' + (oc ? '🔒 ' : '') + n + (ev && !oc ? ' · ' + ev + '📅' : '') + '</span><i style="background:' + (i === 0 ? 'rgba(255,255,255,.7)' : oc ? '#A44DF0' : col) + '"></i></button>';
  }
  return card('Próximos 7 días', '🗓️', s + '</div><div class="hint">Toca un día para ver sus tareas. Verde: liviano · naranjo: cargado · rojo: más que tu meta · 🔒 día ocupado (capacitación, viaje…).</div><button class="btn sm sec" id="bloqBtn" style="margin-top:4px">🔒 Bloquear días o agregar evento</button>');

/* ---------- asistente: observaciones y acciones ---------- */
function insights(){
  const h = hoy(), out = [], venc = vencidas(), meta = metaDiaria(), hechas = hechasEl(h).length;
  const oc = ocupados();
  [0, 1, 2].forEach(k => {
    const d = addDays(h, k), ev = oc[d]; if (!ev) return;
    const L = tareasEnDiaOcupado(d); if (!L.length) return;
    const libre = proximoLibre(d);
    out.push({ ic: '🔒', c: '#A44DF0', tx: (k === 0 ? 'Hoy' : k === 1 ? 'Mañana' : 'El ' + DIAS_L[pd(d).getDay()]) + ' estás en <b>' + esc(ev.titulo) + '</b>. Mueve ' + (L.length === 1 ? 'tu tarea no urgente' : 'tus <b>' + L.length + ' tareas</b> no urgentes') + ' al ' + fmt(libre) + ', tu próximo día libre.', acts: [['Mover al ' + fmt(libre), 'mover:' + d]] });
  });
  const racha = +indicador('Racha') || 0, P = pendientes();
  if (venc.length && !oc[h]) out.push({ ic: '⏰', c: '#F04461', tx: 'Tienes <b>' + venc.length + (venc.length === 1 ? ' tarea vencida' : ' tareas vencidas') + '</b>. Muévelas para ponerte al día sin culpa.', acts: [['Mover a hoy', 'venc-hoy'], ['A mañana', 'venc-man']] });
  if (racha > 0 && hechas < meta && !oc[h]) out.push({ ic: '🔥', c: '#FF8A4C', tx: 'Llevas <b>' + racha + ' días</b> de racha. Completa ' + (meta - hechas) + ' más hoy para mantenerla.' });
  const man = P.filter(t => t.limite === addDays(h, 1)).length;
  if (man > meta) out.push({ ic: '⚖️', c: '#FFB547', tx: 'Mañana tienes <b>' + man + ' tareas</b>, más que tu meta (' + meta + '). Adelanta o mueve alguna.', acts: [['Ver mañana', 'dia-man']] });
  const q1 = P.filter(t => quadOf(t) === 1);
  if (q1.length >= 3) out.push({ ic: '🚨', c: '#F04461', tx: '<b>' + q1.length + ' tareas</b> son urgentes e importantes. Haz una a la vez: empieza por «' + esc(q1.sort(ordenar)[0].tarea) + '».', acts: [['▶ Enfocarme', 'foco-q1']] });
  const esp = P.filter(t => t.estado === 'Esperando respuesta');
  if (esp.length) out.push({ ic: '📨', c: '#3B9EFF', tx: '<b>' + esp.length + '</b> esperando respuesta. Un mensaje de seguimiento puede destrabarlas.' });
  (S.data.proyectos || []).forEach(p => {
    if (p.tiempo != null && p.tiempo - (p.avance || 0) > .15) out.push({ ic: '🚀', c: '#A44DF0', tx: 'El proyecto <b>' + esc(p.nombre) + '</b> va atrasado: ' + pct(p.avance) + '% de avance con ' + pct(p.tiempo) + '% del tiempo. ' + (p.tareas ? '' : 'Aún no tiene tareas.'), acts: [['+ Tarea al proyecto', 'proy:' + p.nombre]] });
  });
  const sin = P.filter(t => !t.limite);
  if (sin.length >= 3) out.push({ ic: '📌', c: '#6D5DFC', tx: '<b>' + sin.length + ' tareas</b> no tienen fecha. Con fecha es mucho más probable cumplirlas.', acts: [['Revisar', 'ver-sin']] });
  if (extNivel() >= 5 && S.neg){
    const est = abiertos().map(n => ({ n, a: analizar(n) })).filter(x => x.a.estancada || x.a.sinResponder != null || x.a.proxVencida);
    if (est.length) out.push({ ic: '🤝', c: '#FF8A4C', tx: '<b>' + est.length + (est.length === 1 ? ' negociación necesita' : ' negociaciones necesitan') + ' atención</b> (' + clpCorto(est.reduce((s, x) => s + (x.n.valor || 0), 0)) + ' en juego): ' + esc(est.sort((x, y) => y.a.prioridad - x.a.prioridad)[0].n.titulo) + (est.length > 1 ? ' y otras' : '') + '.', acts: [['Ver qué hacer', 'neg']] });
  }
  const frios = contactosFrios();
  if (frios.length) out.push({ ic: '🤝', c: '#13B386', tx: '<b>' + frios.length + (frios.length === 1 ? ' cliente' : ' clientes') + '</b> sin contacto hace más de 30 días. Un mensaje de seguimiento puede ser una venta.', acts: [['Ver', 'base-frios']] });
  const pn = extNivel() >= 2 ? personasNuevas() : [];
  if (pn.length) out.push({ ic: '👤', c: '#3B9EFF', tx: 'Nombras a <b>' + pn.slice(0, 3).map(p => esc(p.nombre)).join(', ') + (pn.length > 3 ? ' y ' + (pn.length - 3) + ' más' : '') + '</b> en tus tareas, pero no están en tu base de datos.', acts: [['Agregar', 'personas']] });
  const porC = ((S.base && S.base.contactos) || []).filter(c => c.tipo === 'Por clasificar').length;
  if (porC) out.push({ ic: '📇', c: '#FF5C8A', tx: '<b>' + porC + (porC === 1 ? ' contacto nuevo</b> en tu base de datos espera' : ' contactos nuevos</b> en tu base de datos esperan') + ' que le digas si es cliente o proveedor.', acts: [['Clasificar', 'base-clas']] });
  const sug = S.google && !S.google.inactivo ? sugerencias().filter(x => x.tipo === 'correo').length : 0;
  if (sug) out.push({ ic: '✉️', c: '#FF5C8A', tx: '<b>' + sug + ' correos</b> destacados o importantes podrían ser tareas.', acts: [['Revisar', 'sug']] });
  const dias = (S.data.dias || []).filter(d => d.completadas > 0);
  if (dias.length >= 5){
    const por = {}; dias.forEach(d => { const k = pd(d.fecha).getDay(); por[k] = por[k] || [0, 0]; por[k][0] += d.completadas; por[k][1]++; });
    const best = Object.entries(por).sort((a, b) => b[1][0] / b[1][1] - a[1][0] / a[1][1])[0];
    out.push({ ic: '📈', c: '#13B386', tx: 'Tu día más productivo es el <b>' + DIAS_L[best[0]] + '</b>. Reserva ahí las tareas grandes.' });
  }
  if (hechas >= meta && meta) out.unshift({ ic: '🏆', c: '#13B386', tx: '¡Cumpliste tu meta de hoy (' + meta + ')! Todo lo que hagas ahora es extra ⭐' });
  if (!out.length) out.push({ ic: '🌟', c: '#13B386', tx: 'Todo bajo control. Buen momento para avanzar un proyecto o planificar la semana.' });
  return out.slice(0, 6);
}
function asistenteHTML(){
  return card('Asistente', '💡', insights().map(i => '<div class="ins"><span class="ic" style="background:' + hexToRgba(i.c, .15) + '">' + i.ic + '</span><div class="grow"><div class="tx">' + i.tx + '</div>' +
    (i.acts ? '<div class="acts">' + i.acts.map(a => '<button class="btn sm sec" data-act="' + esc(a[1]) + '">' + esc(a[0]) + '</button>').join('') + '</div>' : '') + '</div></div>').join(''));
}
function bindAsistente(){
  $$('[data-act]').forEach(b => b.onclick = async () => {
    const a = b.dataset.act, h = hoy();
    if (a === 'venc-hoy' || a === 'venc-man') return reprogramar(vencidas(), a === 'venc-hoy' ? h : addDays(h, 1), b);
    if (a === 'dia-man') return openDia(addDays(h, 1));
    if (a === 'foco-q1') return openFocus(pendientes().filter(t => quadOf(t) === 1).sort(ordenar)[0]);
    if (a === 'ver-sin'){ S.q = ''; S.filtro = 'todas'; S.vista = 'lista'; return go('tareas'); }
    if (a === 'sug') return openSugerencias();
    if (a.startsWith('mover:')){ const d = a.slice(6); return reprogramar(tareasEnDiaOcupado(d), proximoLibre(d), b); }
    if (a === 'personas') return openPersonas();
    if (a === 'neg'){ S.nv = 'resumen'; return go('negocios'); }
    if (a === 'base-frios'){ S.bf = 'frios'; return go('base'); }
    if (a === 'base-clas'){ S.bf = 'Por clasificar'; return go('base'); }
    if (a.startsWith('proy:')) return openAdd({ proyecto: a.slice(5) });
  });
}
async function reprogramar(lista, fecha, btn){
  if (!lista.length) return;
  if (btn) btn.disabled = true;
  let ok = 0;
  for (const t of lista){
    if (t.row == null) continue;
    toast('Moviendo ' + (ok + 1) + ' de ' + lista.length + '…');
    try { await updateTask(t, { limite: fecha }); ok++; } catch(e){ toast('No se pudo mover «' + t.tarea + '»'); }
  }
  toast('✓ ' + ok + (ok === 1 ? ' tarea movida a ' : ' tareas movidas a ') + fmtRel(fecha).toLowerCase());
  await load();
}
function openDia(d){
  const T = pendientes().filter(t => t.limite === d || (d === hoy() && t.limite && t.limite < d)).sort(ordenar);
  const ev = S.google && S.google.eventos ? S.google.eventos.filter(e => e.fecha === d) : [];
  const oc = ocupados()[d];
  sheet('<h3>' + (d === hoy() ? '☀️ Hoy' : '📅 ' + fmtLong(d)) + '</h3><div class="hint">' + T.length + ' tareas' + (ev.length ? ' · ' + ev.length + ' eventos' : '') + '</div>' +
    (oc ? '<div class="card" style="background:#EFEAFE"><b>🔒 Día ocupado: ' + esc(oc.titulo) + '</b>' + (T.filter(t => quadOf(t) !== 1).length ? '<div class="btns" style="margin-top:8px"><button class="btn sm" id="dMover">Mover las no urgentes al ' + fmt(proximoLibre(d)) + '</button></div>' : '') + '</div>' : '') +
    (ev.length ? '<div class="card">' + ev.map(e => '<div class="ev"><div class="hr">' + (e.todoElDia ? 'Día' : esc(e.inicio)) + '</div><span class="dot" style="background:' + esc(e.color || '#6D5DFC') + '"></span><div class="grow"><b style="font-size:14px">' + esc(e.titulo) + '</b></div></div>').join('') + '</div>' : '') +
    '<div class="card">' + (T.length ? T.map(t => taskHTML(t)).join('') : '<div class="empty">Día libre de tareas 🌴</div>') + '</div>' +
    '<div class="btns"><button class="btn" id="dAdd">+ Tarea para este día</button></div>');
  bindTasks($('#layer'));
  $('#dAdd').onclick = () => openAdd({ limite: d });
  const dm = $('#dMover'); if (dm) dm.onclick = () => { closeSheet(); reprogramar(tareasEnDiaOcupado(d), proximoLibre(d)); };

/* ---------- calendario y correo: sugerencias ---------- */
function sugerencias(){
  const g = S.google; if (!g || g.inactivo) return [];
  const listo = lsGet('sugListas', {}), h = hoy();
  const titulos = new Set(S.data.tareas.map(t => norm(t.tarea)));
  const notas = S.data.tareas.map(t => t.notas || '').join(' ');
  const out = [];
  (g.eventos || []).forEach(e => {
    if (listo[e.id] || e.fecha < h) return;

}

// Un contacto se relaciona con una tarea si la tarea nombra su nombre completo o su empresa.
function clavesContacto(c){ const k = []; if (c.nombre && String(c.nombre).trim().includes(' ')) k.push(norm(c.nombre).trim()); if (c.empresa && String(c.empresa).trim().length >= 3) k.push(norm(c.empresa).trim()); return k; }

  const out = {}, re = /(?:^|\s)(?:a|al|con|para|de|del)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+){1,2})/g;

// Diagnóstico de una negociación: actividad, salud (0-100), probabilidad ajustada, prioridad y señales.
function analizar(n){
  const h = hoy(), e = etapaDe(n), I = interDe(n).slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
  const hist = historialDe(n), ultEtapa = hist.length ? hist[hist.length - 1].f : (n.creada || h);
  const c = n.contacto ? contactoPorId(n.contacto) : null;
  const ultAct = [n.actividad, ultEtapa].concat(I.map(i => i.fecha)).filter(Boolean).sort().pop() || h;
  const dEtapa = Math.max(0, diffDays(ultEtapa, h)), dAct = Math.max(0, diffDays(ultAct, h));

  const sinProx = abierta && !n.proxima;
  const correos = I.filter(i => /correo/i.test(i.tipo)), ult = correos[correos.length - 1];
  const sinResponder = abierta && ult && /recibido/i.test(ult.tipo) ? Math.max(0, diffDays(ult.fecha, h)) : null;
  const corpus = norm([n.notas, n.producto, c && c.notas, c && c.etiquetas].concat(I.slice(-15).map(i => i.detalle)).join(' '));
  const senales = SENALES.filter(x => x.re.test(corpus));
  const recientes = I.filter(i => diffDays(i.fecha, h) <= 14).length;
  let salud = 100 - Math.min(55, dAct / max * 35) - (proxVencida ? 15 : 0) - (sinProx ? 10 : 0) - (sinResponder != null ? 15 : 0) + (recientes >= 2 ? 8 : 0) + (n.cierre && n.cierre >= h ? 4 : 0);
  salud = Math.max(5, Math.min(100, Math.round(salud)));

  return { e, c, I, corpus, dEtapa, dAct, ultAct, estancada, proxVencida, sinProx, sinResponder, senales, salud, prob, abierta, prioridad: urg * 10 + Math.log10(1 + (n.valor || 0)) * prob * 3 };

// Métricas del tablero: pipeline, pronóstico ponderado, tasa de cierre, ciclo de venta, ticket y conversión por etapa.
function metricasNeg(){
  const h = hoy(), N = negocios(), A = abiertos(), mes = h.slice(0, 7);
  const fechaFin = n => { const hi = historialDe(n); return hi.length ? hi[hi.length - 1].f : n.actividad; };
  const ganadas = N.filter(n => n.estado === 'Ganada'), perdidas = N.filter(n => n.estado === 'Perdida');
  const g90 = ganadas.filter(n => diffDays(fechaFin(n), h) <= 90), p90 = perdidas.filter(n => diffDays(fechaFin(n), h) <= 90);
  const gMes = ganadas.filter(n => (fechaFin(n) || '').slice(0, 7) === mes);
  const an = A.map(n => ({ n, a: analizar(n) }));
  const ciclo = ganadas.map(n => diffDays(n.creada || fechaFin(n), fechaFin(n))).filter(x => x >= 0);
  const alcanzo = ETAPAS.map((e, i) => N.filter(n => n.estado === 'Ganada' || historialDe(n).some(x => etapaIdx(x.e) >= i) || etapaIdx(n.etapa) >= i).length);
  const meses = [];
  for (let i = 5; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = iso(d).slice(0, 7); meses.push({ k, nom: MESES[d.getMonth()], v: ganadas.filter(n => (fechaFin(n) || '').slice(0, 7) === k).reduce((s, n) => s + (n.valor || 0), 0) }); }
  const motivos = {}; perdidas.forEach(n => { const m = String(n.motivo || 'Sin motivo').split(' · ')[0]; motivos[m] = (motivos[m] || 0) + 1; });
  return {
    an, abiertoV: A.reduce((s, n) => s + (n.valor || 0), 0), ponderado: an.reduce((s, x) => s + (x.n.valor || 0) * x.a.prob, 0),
    gMes, gMesV: gMes.reduce((s, n) => s + (n.valor || 0), 0), tasa: g90.length + p90.length ? g90.length / (g90.length + p90.length) : null,
    ciclo: ciclo.length ? Math.round(ciclo.reduce((s, x) => s + x, 0) / ciclo.length) : null,
    ticket: ganadas.length ? ganadas.reduce((s, n) => s + (n.valor || 0), 0) / ganadas.length : null,
    estancadas: an.filter(x => x.a.estancada), alcanzo, meses, motivos
  };
}

function oportunidades(){
  if (!S.base) return [];
  const con = new Set(abiertos().map(n => n.contacto)), I = S.base.interacciones || [], h = hoy();
  return contactos().filter(c => ['Cliente', 'Por clasificar'].includes(c.tipo) && !con.has(c.id)).map(c => {
    const rec = I.filter(i => i.id === c.id && diffDays(i.fecha, h) <= 30);
    return { c, rec, compra: /precio|cotiz|comprar|interes|test|probar|disponib|cuota|valor|reserv|talla|levo|bici/.test(norm([c.notas, c.etiquetas].concat(rec.map(i => i.detalle)).join(' '))) };
  }).filter(x => x.compra && x.rec.length).slice(0, 5);
}

function chartDias(dias){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 150, pad = 18, n = dias.length, bw = (W - pad * 2) / n;
  const max = Math.max(4, ...dias.map(x => x.completadas), ...dias.map(x => x.meta || 0));
  const y = v => H - 22 - (v / max) * (H - 40);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A44DF0"/><stop offset="1" stop-color="#6D5DFC"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD2A8"/><stop offset="1" stop-color="#13B386"/></linearGradient></defs>';
  dias.forEach((x, i) => {
    const bx = pad + i * bw + 3, bh = (H - 22) - y(x.completadas);
    s += '<rect x="' + bx + '" y="' + y(x.completadas) + '" width="' + (bw - 6) + '" height="' + Math.max(0, bh) + '" rx="4" fill="' + (x.completadas >= x.meta && x.meta > 0 ? 'url(#gg)' : 'url(#gb)') + '"/>';
    if (x.completadas) s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (y(x.completadas) - 3) + '" text-anchor="middle">' + x.completadas + '</text>';
    s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + pd(x.fecha).getDate() + '</text>';
  });
  const meta = dias[dias.length - 1].meta;
  if (meta) s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(meta) + '" y2="' + y(meta) + '" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/><text x="' + (W - pad) + '" y="' + (y(meta) - 3) + '" text-anchor="end">meta ' + meta + '</text>';
  return s + '</svg>';
}
function chartLine(dias, key, color){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 130, pad = 18, n = dias.length;
  const vals = dias.map(x => x[key] || 0), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const x = i => pad + i * (W - pad * 2) / Math.max(1, n - 1);
  const y = v => H - 20 - ((v - min) / (max - min || 1)) * (H - 34);
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = 'M' + x(0) + ',' + (H - 20) + ' L' + pts.replace(/ /g, ' L') + ' L' + x(n - 1) + ',' + (H - 20) + ' Z';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  s += '<path d="' + area + '" fill="' + hexToRgba(color, .16) + '" stroke="none"/>';
  s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  dias.forEach((d, i) => { if (i === n - 1 || i % Math.ceil(n / 6) === 0) s += '<text x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="middle">' + pd(d.fecha).getDate() + '</text>'; });
  s += '<circle cx="' + x(n - 1) + '" cy="' + y(vals[n - 1]) + '" r="4" fill="' + color + '"/>';
  return s + '</svg>';
}

  html += card('Por categoría', '🏷️', catArr.length ? catArr.map(c => { const col = catCol(c[0]); return '<div class="hb"><div class="n"><span>' + catIc(c[0]) + ' ' + esc(c[0]) + '</span><span>' + c[1].h + ' hechas · ' + c[1].p + ' pend.</span></div><div class="b"><i style="width:' + (c[1].h / mx * 100) + '%;background:' + col + '"></i><i style="width:' + (c[1].p / mx * 100) + '%;background:' + hexToRgba(col, .3) + '"></i></div></div>'; }).join('') : '<div class="empty">Sin datos todavía.</div>');
  html += card('Proyectos · avance vs tiempo', '🚀', d.proyectos.length ? d.proyectos.map(p => '<div class="hb"><div class="n"><span>' + esc(p.nombre) + '</span><span>' + pct(p.avance) + '% · ' + esc(p.ritmo || '') + '</span></div><div class="bar"><i style="width:' + pct(Math.min(1, p.avance)) + '%;background:' + paletteColor(p.nombre) + '"></i>' + (p.tiempo != null ? '<u style="left:calc(' + pct(p.tiempo) + '% - 1px)"></u>' : '') + '</div></div>').join('') + '<div class="hint">La línea marca el tiempo transcurrido del proyecto.</div>' : '<div class="empty">Aún no hay proyectos.</div>');
  return html;

// Hojas que suben desde abajo: se cierran con ✕, tocando fuera, deslizando hacia abajo o con «atrás».
let hojaEnHistorial = false, ignorarPop = false;
function sheet(html){
  const layer = $('#layer'), yaAbierta = !!layer.innerHTML;
  layer.innerHTML = '<div class="backdrop"><div class="sheet"><button class="sheet-x" aria-label="Cerrar">✕</button>' + html + '</div></div>';
  const bd = layer.firstChild, sh = bd.firstChild;
  bd.onclick = e => { if (e.target === bd) closeSheet(); };
  sh.querySelector('.sheet-x').onclick = () => closeSheet();
  deslizarParaCerrar(sh);
  if (!yaAbierta && !hojaEnHistorial){ try { history.pushState({ hoja: 1 }, ''); hojaEnHistorial = true; } catch(e){} }
  return layer;
}
function deslizarParaCerrar(sh){
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && sh.scrollTop <= 0){ sh.style.transform = 'translateY(' + dy + 'px)'; if (e.cancelable) e.preventDefault(); }
    else { y0 = null; sh.style.transform = ''; }
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90){ sh.style.transform = 'translateY(100%)'; setTimeout(() => closeSheet(), 170); }
    else sh.style.transform = '';
  });
}
function cerrarHoja(){ $('#layer').innerHTML = ''; if (focusTick){ clearInterval(focusTick); focusTick = null; } focusPill(); }
function closeSheet(){
  cerrarHoja();
  if (hojaEnHistorial){ hojaEnHistorial = false; ignorarPop = true; history.back(); }
}
window.addEventListener('popstate', () => {
  if (ignorarPop){ ignorarPop = false; return; }
  if (hojaEnHistorial || $('#layer').innerHTML){ hojaEnHistorial = false; cerrarHoja(); }
});

/* ---------- inteligencia: lenguaje natural y categoría automática ---------- */
const SEMILLAS = {
  'Ventas': ['cliente','venta','vender','cotiz','pedido','seguimiento','proveedor','ebike','repuesto','precio','valor','averiguar','compra','oferta','institucional','motor','corona','pedal','bicicleta','bici'],

  'Eventos': ['evento','carrera','test','lanzamiento','feria','cronometraje','competencia','demo'],

  'Capacitaciones': ['capacitacion','curso','entrenamiento','charla','certificacion','capacitar'],
  'Futuros proyectos': ['idea','futuro','evaluar','explorar'],

  'Hogar': ['casa','limpiar','supermercado','arreglar','jardin','lavar','cocinar','depto','departamento'],
  'Aprendizaje': ['estudiar','aprender','leer','libro','claude','investigar','sbcu','ingles','tutorial','app'],
  'Familia y amigos': ['cumpleanos','mama','papa','familia','amigo','amigos','asado','regalo','hijo','hija','pareja','abuela','abuelo']
};
const STOP = new Set('para con por que del los las una uno unos unas sin sobre entre desde hasta este esta estos estas como mas hay ser hoy manana tarea hacer'.split(' '));
function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w)); }
// Aprende de tus tareas: qué palabras usas en cada categoría. Suma palabras clave del rubro.
function adivinar(texto){
  const c = S.data.config, cats = c.categorias.map(x => x.nombre), w = tokens(texto);
  if (!w.length) return {};
  const sc = {};
  S.data.tareas.forEach(t => { if (!t.categoria || !cats.includes(t.categoria)) return; const tw = tokens(t.tarea); w.forEach(x => { if (tw.includes(x)) sc[t.categoria] = (sc[t.categoria] || 0) + 2; }); });
  Object.entries(SEMILLAS).forEach(([cat, sem]) => { if (!cats.includes(cat)) return; w.forEach(x => { if (sem.some(s => x === s || (s.length >= 4 && x.startsWith(s)))) sc[cat] = (sc[cat] || 0) + 3; }); });
  const best = Object.entries(sc).sort((a, b) => b[1] - a[1])[0];
  if (!best || best[1] < 2) return {};
  const cat = c.categorias.find(x => x.nombre === best[0]);
  return { categoria: cat.nombre, area: cat.area };
}
const WD_N = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const MES_N = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Entiende frases como «llamar a Crank mañana a las 10 urgente #ventas».
function parseTarea(txt){
  const h = hoy(), r = { repetir: null, limite: null, urgente: null, importante: null, tamano: null, categoria: null, area: null, proyecto: null, hora: null };
  let n = norm(txt); const cortes = [];
  const B = '(?=[\\s,.;]|$)';
  const regla = (re, fn) => { const m = new RegExp('(^|\\s)(' + re + ')' + B).exec(n); if (!m) return false; const ini = m.index + m[1].length, fin = ini + m[2].length; if (fn(m.slice(2)) === false) return false; cortes.push([ini, fin]); n = n.slice(0, ini) + ' '.repeat(fin - ini) + n.slice(fin); return true; };
  const fecha = f => { if (!r.limite) r.limite = f; };
  const rep = v => () => { r.repetir = v; };
  regla('(?:cada|todos los|todas las) (lunes|martes|miercoles|jueves|viernes|sabado|domingo)', m => { r.repetir = 'Semanal'; fecha(addDays(h, (WD_N.indexOf(m[1]) - pd(h).getDay() + 7) % 7)); }) ||
  regla('de lunes a viernes|(?:todos los |cada )?dias? habil(?:es)?', rep('Días hábiles')) ||
  regla('todos los dias|cada dia|diariamente|diari[ao]', rep('Diaria')) ||
  regla('cada 15 dias|cada dos semanas|quincenal(?:mente)?', rep('Quincenal')) ||
  regla('cada semana|todas las semanas|semanal(?:mente)?', rep('Semanal')) ||
  regla('cada mes|todos los meses|mensual(?:mente)?', rep('Mensual')) ||
  regla('cada ano|todos los anos|anual(?:mente)?', rep('Anual'));
  regla('(?:para )?pasado manana', () => fecha(addDays(h, 2))) ||
  regla('(?:para )?hoy', () => fecha(h)) ||
  regla('(?:para )?manana', () => fecha(addDays(h, 1))) ||
  regla('en (\\d{1,2}) (dias?|semanas?)', m => fecha(addDays(h, (+m[1]) * (m[2].startsWith('sem') ? 7 : 1)))) ||
  regla('(?:la )?(?:proxima|otra) semana', () => fecha(nextMonday(h))) ||
  regla('(?:este |el )?(?:fin de semana|finde)', () => { const d = pd(h).getDay(); fecha(addDays(h, d === 6 ? 0 : (6 - d + 7) % 7)); }) ||
  regla('(?:el |este |proximo |el proximo )?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)', m => { const w = WD_N.indexOf(m[1]); let k = (w - pd(h).getDay() + 7) % 7; if (k === 0) k = 7; fecha(addDays(h, k)); }) ||
  regla('(?:el |para el )?(\\d{1,2})[/\\-](\\d{1,2})(?:[/\\-](\\d{2,4}))?', m => {
    const dd = +m[1], mm = +m[2]; if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return false;
    let yy = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : pd(h).getFullYear();
    let f = iso(new Date(yy, mm - 1, dd)); if (!m[3] && f < h) f = iso(new Date(yy + 1, mm - 1, dd)); fecha(f);
  }) ||
  regla('(?:el |para el )?(\\d{1,2}) (?:de )?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*', m => {
    const dd = +m[1], mm = MES_N.indexOf(m[2]); if (dd < 1 || dd > 31) return false;
    const yy = pd(h).getFullYear(); let f = iso(new Date(yy, mm, dd)); if (f < h) f = iso(new Date(yy + 1, mm, dd)); fecha(f);
  });
  regla('(?:a las |a la )(\\d{1,2})(?::(\\d{2}))?(?: ?(?:hrs?|h))?|(\\d{1,2}):(\\d{2})(?: ?(?:hrs?|h))?|(\\d{1,2}) ?(am|pm|hrs)', m => {
    let hh = +(m[1] || m[3] || m[5]), mi = m[2] || m[4] || '00';
    if (m[6] === 'pm' && hh < 12) hh += 12; if (hh > 23) return false; r.hora = String(hh).padStart(2, '0') + ':' + mi;
  });
  regla('urgente|!+|asap', () => { r.urgente = 'Sí'; });
  regla('importante|\\*', () => { r.importante = 'Sí'; });
  const c = S.data.config;
  let m; const tagRe = /(^|\s)#([a-z0-9_\-]+)/;
  while ((m = tagRe.exec(n))){
    const k = m[2], ini = m.index + m[1].length, fin = ini + m[2].length + 1;
    const area = c.areas.find(a => norm(a).startsWith(k));
    const cat = c.categorias.find(x => norm(x.nombre).replace(/\s+/g, '').startsWith(k.replace(/[-_]/g, '')));
    const tam = c.tamanos.find(x => norm(x.nombre).startsWith(k));
    if (area) r.area = area; else if (cat){ r.categoria = cat.nombre; r.area = cat.area; } else if (tam) r.tamano = tam.nombre;
    cortes.push([ini, fin]); n = n.slice(0, ini) + ' '.repeat(fin - ini) + n.slice(fin);
  }
  const atRe = /(^|\s)@([a-z0-9_\-]+)/;
  if ((m = atRe.exec(n))){
    const p = S.data.proyectos.find(x => norm(x.nombre).replace(/\s+/g, '').includes(m[2]));
    if (p){ r.proyecto = p.nombre; const ini = m.index + m[1].length; cortes.push([ini, ini + m[2].length + 1]); }
  }
  let titulo = txt; cortes.sort((a, b) => b[0] - a[0]).forEach(([a, b]) => { titulo = titulo.slice(0, a) + titulo.slice(b); });
  titulo = titulo.replace(/\s+/g, ' ').replace(/(\s+(para|el|la|las|los|a|al|de|del|en|con|y))+\s*$/i, '').replace(/[\s,;]+$/, '').trim();
  r.titulo = titulo ? titulo.charAt(0).toUpperCase() + titulo.slice(1) : '';
  if (!r.categoria){ const g = adivinar(r.titulo); if (g.categoria){ r.categoria = g.categoria; r.area = r.area || g.area; r.adivinada = true; } }
  return r;
}

/* ---------- agregar tarea (inteligente) ---------- */
function openAdd(pre){
  const d = S.data; if (!d) return;
  pre = pre || {};

async function guardarExtrasNueva(texto, antes, repetir, subs){

// Dictado por voz (Chrome en Android lo soporta).
function dictar(input, btn, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR(); rec.lang = 'es-CL'; rec.interimResults = true; rec.maxAlternatives = 1;
  const base = input.value ? input.value.trim() + ' ' : '';
  btn.classList.add('on');
  rec.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = base + t; cb(); };
  rec.onerror = e => { btn.classList.remove('on'); if (e.error === 'not-allowed') toast('Permite el micrófono para dictar'); };
  rec.onend = () => btn.classList.remove('on');
  try { rec.start(); } catch(e){ btn.classList.remove('on'); }
}

function bindSubtareas(t){
  let subs = (t.subtareas || []).map(x => Object.assign({}, x));
  const guardar = async () => {
    t.subtareas = subs.map(x => Object.assign({}, x));

    catch(e){ toast('No se pudo guardar: ' + e.message); }
  };
  const pintar = () => {
    const n = subs.filter(x => x.ok).length;
    $('#e_subs').innerHTML = (subs.length ? '<div class="bar" style="margin:10px 0 4px"><i style="width:' + (n / subs.length * 100) + '%;background:var(--ok)"></i></div>' : '') +

        : '<div class="hint">Divide la tarea en pasos pequeños: es más fácil partir.</div>');
    $$('[data-si]').forEach(b => b.onclick = () => {
      const x = subs[+b.dataset.si]; x.ok = !x.ok; pintar(); guardar();
