  const pintar = () => {
    const g = focusState(); if (!g) return;
    const resta = g.fin ? Math.max(0, g.fin - Date.now()) : g.resta, tot = g.dur * 60000;
    const mm = Math.floor(resta / 60000), ss = Math.floor(resta % 60000 / 1000);
    $('#fRing').innerHTML = ring(1 - resta / tot, 'url(#fg)', 'var(--soft)', 220).replace('</svg>', '<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5DFC"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient></defs></svg>') +
      '<b>' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0') + '<span>' + (g.fin ? 'enfocado…' : resta < tot ? 'en pausa' : 'listo para partir') + '</span></b>';
    $('#fGo').textContent = g.fin ? '⏸ Pausar' : resta < tot ? '▶ Seguir' : '▶ Comenzar';
    if (g.fin && resta <= 0) focusFin();
  };
  $$('#fDur .pill').forEach(b => b.onclick = () => { const g = focusState(); if (g.fin) return toast('Pausa primero para cambiar'); g.dur = +b.dataset.v; g.resta = g.dur * 60000; lsSet('focus', g); setPill('fDur', b.dataset.v); pintar(); });
  $('#fGo').onclick = () => { const g = focusState(); if (g.fin){ g.resta = Math.max(0, g.fin - Date.now()); g.fin = 0; } else g.fin = Date.now() + g.resta; lsSet('focus', g); pintar(); };
  $('#fStop').onclick = () => { LS.removeItem('focus'); closeSheet(); };
  pintar();
  if (focusTick) clearInterval(focusTick);
  focusTick = setInterval(pintar, 1000);
}
function focusFin(){
  const f = focusState(); if (!f) return;
  LS.removeItem('focus'); if (focusTick){ clearInterval(focusTick); focusTick = null; }
  vibrar([250, 120, 250, 120, 400]); confetti(40);
  const t = S.data && S.data.tareas.find(x => x.row === f.row);
  sheet('<h3>⏰ ¡Tiempo!</h3><div class="hint" style="font-size:15px">Terminaste ' + f.dur + ' minutos enfocado en <b>' + esc(f.tarea) + '</b>. ¿Cómo quedó?</div>' +
    '<div class="btns">' + (t && !t.hecho ? '<button class="btn" id="ffDone">✅ La terminé</button>' : '') + '<button class="btn sec" id="ffMore">▶ 5 min más</button></div>' +
    '<div class="btns"><button class="btn sec" id="ffClose">Tomar un descanso ☕</button></div>');
  if (t && !t.hecho) $('#ffDone').onclick = () => { closeSheet(); toggle(t); };
  $('#ffMore').onclick = () => { lsSet('focus', { row: f.row, tarea: f.tarea, dur: 5, fin: Date.now() + 5 * 60000, resta: 5 * 60000 }); focusSheet(); };
  $('#ffClose').onclick = closeSheet;
}
function focusPill(){
  const f = focusState(), b = $('#focusPill');
  if (!f || $('#layer').innerHTML){ b.hidden = true; return; }
  const resta = f.fin ? f.fin - Date.now() : f.resta;
  if (f.fin && resta <= 0){ b.hidden = true; return focusFin(); }
  b.hidden = false; b.textContent = (f.fin ? '⏱ ' : '⏸ ') + Math.ceil(resta / 60000) + ' min · ' + f.tarea;
  b.onclick = focusSheet;
}
setInterval(() => { if (!$('#layer').innerHTML) focusPill(); }, 15000);

/* ---------- celebración ---------- */
function confetti(n){
  const cols = ['#6D5DFC','#FF5C8A','#FFB547','#13B386','#3B9EFF','#A44DF0'];
  for (let i = 0; i < (n || 36); i++){
    const s = document.createElement('i'); s.className = 'confetti';
    s.style.left = Math.random() * 100 + 'vw'; s.style.background = cols[i % cols.length];
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = Math.random() * .25 + 's'; s.style.animationDuration = (1.2 + Math.random() * .8) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

/* ---------- acciones ---------- */
async function toggle(t){
  if (!t) return;
  if (t.row == null){ toast('Espera a que se sincronice'); return; }
  const antes = { hecho: t.hecho, cierre: t.cierre };
  t.hecho = !t.hecho; t.cierre = t.hecho ? (hoy() + 'T' + new Date().toTimeString().slice(0, 5)) : '';
  if (t.hecho){ confetti(); vibrar(35); }
  render();
  try {
    await api('toggle', { row: t.row, tarea: t.tarea, hecho: t.hecho });
    if (t.hecho){ const n = hechasEl(hoy()).length, m = metaDiaria(); toast(n === m ? '🏆 ¡Meta del día cumplida!' : '¡Hecha! ✓ ' + n + '/' + m + ' hoy'); if (n === m) confetti(90); }
    const ng = t.hecho && extNivel() >= 5 && String(t.notas || '').match(/\((N-[a-z0-9]+)\)/);
    if (ng) apiX('negocioNota', { id: ng[1], texto: '✅ ' + t.tarea, tipo: '✅ Tarea' }).then(() => loadNeg(true)).catch(() => {});
    if (t.hecho && t.repetir && !S.extInactivo){
      try { const r = await apiX('siguiente', { row: t.row, tarea: t.tarea }); if (r.creada) toast('🔁 Lista la próxima: ' + fmtRel(r.fecha).toLowerCase()); }
      catch(e){ toast('No se pudo crear la siguiente: ' + e.message); }
    }
    load();
  }
  catch(e){ t.hecho = antes.hecho; t.cierre = antes.cierre; render(); toast('No se pudo guardar: ' + e.message); }
}

/* ---------- configuración inicial y ajustes ---------- */
function showSetup(){
  sheet('<h3>🔌 Conectar con tu Sheet</h3><div class="hint">Pega el link de tu aplicación web (termina en /exec) y la clave que pusiste en el script.</div>' +
    '<label class="l">Link de la aplicación web</label><input type="url" id="s_url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(LS.url || '') + '">' +
    '<label class="l">Clave</label><input type="password" id="s_tok" value="' + esc(LS.token || '') + '">' +
    '<div class="btns"><button class="btn" id="s_ok">Conectar</button></div>');
  $('#s_ok').onclick = async () => {
    const url = $('#s_url').value.trim(), tok = $('#s_tok').value;
    if (!url || !tok){ toast('Faltan datos'); return; }
    LS.url = url; LS.token = tok; $('#s_ok').disabled = true; $('#s_ok').textContent = 'Conectando…';
    try { S.data = await api('state'); LS.cache = JSON.stringify(S.data); closeSheet(); render(); toast('Conectado ✓'); loadGoogle(true); }
    catch(e){ $('#s_ok').disabled = false; $('#s_ok').textContent = 'Conectar'; toast(e.message === 'auth' ? 'La clave no coincide' : 'No se pudo conectar. Revisa el link.'); }
  };
}
function showSettings(){
  const g = S.google, gTxt = S.extInactivo || (g && g.inactivo) ? 'No activadas' : !g ? 'Revisando…' : 'Activas ✓ · ' + (g.eventos || []).length + ' eventos · ' + (g.correos || []).length + ' correos' + (g.avisos && g.avisos.length ? ' · ⚠️ ' + g.avisos.join(' · ') : '');
  sheet('<h3>⚙️ Ajustes</h3><div class="hint">Conectado a tu Sheet del organizador.</div>' +
    (deferredInstall ? '<div class="btns"><button class="btn" id="s_inst">📲 Instalar app en este dispositivo</button></div>' : '') +
    '<div class="card"><b>✨ Funciones extra</b> <span class="hint">(calendario, correo, subtareas, repetir)</span><div class="hint">' + esc(gTxt) + '</div><button class="btn sm sec" id="s_g">' + (g && !g.inactivo ? 'Ver sugerencias' : 'Cómo activarlas') + '</button></div>' +
    (extNivel() >= 2 ? '<div class="card"><b>📅 Recordatorios en tu calendario</b><div class="hint">Cada tarea pendiente con fecha está en el calendario «' + esc((S.ext && S.ext.calendario) || 'Organizador BlackLine') + '», con aviso en tu teléfono 10 min antes (a las 9:00, o a la hora que pongas: «a las 15:30»). Se actualiza solo cada hora y cuando cambias algo.</div><button class="btn sm sec" id="s_sinc">🔄 Sincronizar ahora</button></div>' : necesitaActualizar() ? '<div class="card"><b>⬆️ Hay una versión nueva del script</b><div class="hint">📅 Recordatorios y 📇 base de datos solo con contacto@blacklinechile.cl.</div><button class="btn sm" id="s_upd">Actualizar (2 min)</button></div>' : '') +
    '<div class="card"><b>✨ Trucos para agregar rápido</b><div class="hint">• Fechas: <i>hoy, mañana, pasado mañana, el viernes, en 3 días, 15/10, 20 de octubre, la próxima semana</i><br>• Hora: <i>a las 10, 15:30</i><br>• Prioridad: <i>urgente</i> o <i>!</i> · <i>importante</i><br>• Categoría o área: <i>#ventas, #marketing, #personal</i><br>• Proyecto: <i>@levo</i><br>• Repetir: <i>cada lunes, todos los días, días hábiles, cada mes</i><br>• Toca 🎤 para dictar.</div></div>' +
    '<div class="btns"><button class="btn sec" id="s_re">Cambiar link o clave</button></div>' +
    '<div class="btns"><button class="btn bad" id="s_out">Desconectar este dispositivo</button></div>');
  if (deferredInstall) $('#s_inst').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeSheet(); };
  $('#s_g').onclick = () => g && !g.inactivo ? openSugerencias() : showExtrasSetup();
  const ss2 = $('#s_sinc'); if (ss2) ss2.onclick = async () => { ss2.disabled = true; try { const r = await apiX('sinc'); toast('📅 ' + r.creados + ' nuevos · ' + r.actualizados + ' actualizados · ' + r.borrados + ' borrados'); } catch(e){ toast('No se pudo: ' + e.message); } ss2.disabled = false; };
  const su = $('#s_upd'); if (su) su.onclick = showExtrasUpdate;
  $('#s_re').onclick = showSetup;
  $('#s_out').onclick = () => { if (confirm('Se borran el link y la clave de este dispositivo.')){ ['url', 'token', 'cache', 'googleCache', 'extCache', 'baseCache', 'negCache'].forEach(k => LS.removeItem(k)); S.data = null; S.google = null; closeSheet(); showSetup(); } };
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('error', e => toast('Error: ' + (e.error && e.error.message || e.message)));
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message || e.reason)));
document.addEventListener('visibilitychange', () => { if (!document.hidden && LS.url && S.data){ load(); focusPill(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- inicio ---------- */
if (LS.cache) { try { S.data = JSON.parse(LS.cache); } catch(e){} }
S.google = lsGet('googleCache', null);
S.ext = lsGet('extCache', null);
S.base = lsGet('baseCache', null);
S.neg = lsGet('negCache', null);
if (!LS.url || !LS.token) { render(); showSetup(); } else { render(); load(); }
</script>
</body>
