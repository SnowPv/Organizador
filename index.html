<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Organizador</title>
<style>
:root{
  /* Sistema de diseño sobrio: fondo gris claro, tarjetas blancas, un solo acento azul; los colores de estado solo para alertas */
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1D2433; --muted:#667085; --line:#E4E7EC; --soft:#F2F4F7;
  --accent:#2A78D6; --accent-ink:#1E5FB3; --accent-soft:#EAF2FC;
  --ok:#12A06B; --warn:#E5A000; --bad:#D92D20; --info:#2A78D6;
  --ok-ink:#0B7A51; --warn-ink:#9A6700; --bad-ink:#B42318; --info-ink:#1E5FB3;
  --pink:#2A78D6; --amber:#E5A000; --trabajo:#2A78D6; --personal:#7A5AF8;
  --grad:#2A78D6; --grad-warm:#2A78D6; --grad-cool:#2A78D6; --grad-green:#12A06B;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 12px 32px -12px rgba(16,24,40,.25);
  --shadow-fab:0 10px 24px -8px rgba(42,120,214,.6);
  --s1:#BFD5F2; --s2:#93B8EA; --s3:#6198DF; --s4:#2A78D6; --s5:#1B57A6;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
main{padding-bottom:24px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 72%, transparent);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}
header.top small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow-sm);width:40px;height:40px;border-radius:13px;font-size:17px;color:var(--ink)}
.chip-off{background:rgba(245,165,36,.16);color:var(--warn-ink);border-radius:999px;padding:3px 10px;font-size:11px;margin-left:8px;font-weight:700;vertical-align:middle}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow-sm)}
.card h2{font-size:14px;letter-spacing:.01em;color:var(--ink);margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .ct{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.card h2 .em{font-size:17px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.link{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:13.5px;padding:8px 0 0}

/* héroe */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px;margin:6px 0 12px;box-shadow:0 18px 36px -18px rgba(164,77,240,.8);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-size:14px;font-weight:600;opacity:.9}
.hero .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px;line-height:1.2}
.hero .in{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ring b span{font-size:11px;font-weight:700;opacity:.85}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.hstat{background:rgba(255,255,255,.18);border-radius:15px;padding:8px 10px;backdrop-filter:blur(4px)}
.hstat b{display:block;font-size:17px;font-weight:800}
.hstat span{font-size:11px;font-weight:600;opacity:.9}
.lvl{position:relative;z-index:1;margin-top:12px}
.lvl .bar{background:rgba(255,255,255,.25)}
.lvl .bar i{background:#fff}
.lvl small{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.92;margin-top:5px}

/* fichas de colores */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:18px;padding:10px 8px;color:#fff;text-align:left;border:0;box-shadow:var(--shadow-sm)}
.tile .ic{font-size:17px;display:block}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:2px;line-height:1.1}
.tile span{font-size:10.5px;font-weight:700;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border-radius:18px;padding:11px;box-shadow:var(--shadow-sm);border-top:4px solid var(--c,var(--accent))}
.kpi b{font-size:21px;display:block;font-weight:800;letter-spacing:-.01em}.kpi span{font-size:11px;color:var(--muted);font-weight:700}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar u{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.45}

/* tareas */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--q,#C9C8D6);background:color-mix(in srgb, var(--q,#C9C8D6) 10%, transparent);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;transition:transform .15s,background .15s;padding:0}
.chk:active{transform:scale(.85)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.task .t{font-weight:650;line-height:1.3;word-break:break-word;letter-spacing:-.005em}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .why{font-size:12px;color:var(--accent-ink);font-weight:700;margin-top:3px}
.play{flex:none;border:0;width:34px;height:34px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--accent-ink)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.tag.bad{background:rgba(240,68,97,.14);color:var(--bad-ink)}.tag.warn{background:rgba(245,165,36,.17);color:var(--warn-ink)}.tag.ok{background:rgba(19,179,134,.15);color:var(--ok-ink)}.tag.info{background:rgba(59,158,255,.14);color:var(--info-ink)}
.empty{text-align:center;color:var(--muted);padding:22px 6px;font-size:14px;font-weight:500;line-height:1.5}

/* navegación */
nav.bottom{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--card) 92%, transparent);backdrop-filter:blur(12px);border-radius:24px;padding:6px 4px;display:flex;justify-content:space-around;z-index:8;box-shadow:var(--shadow-md);border:1px solid var(--line);max-width:720px;margin:0 auto}
nav.bottom button{flex:1;min-width:0;border:0;background:none;padding:4px 0;color:var(--muted);font-size:9.5px;font-weight:700;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button span{display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;width:38px;height:30px;border-radius:12px;filter:grayscale(.6);opacity:.75;transition:all .2s}
nav.bottom button.on{color:var(--accent-ink)}
nav.bottom button.on span{background:var(--soft);filter:none;opacity:1;transform:translateY(-1px)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--grad);color:#fff;font-size:32px;font-weight:300;line-height:1;box-shadow:var(--shadow-fab);z-index:9;transition:transform .12s}
.fab:active{transform:scale(.92)}
.focus-pill{position:fixed;left:16px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:9;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13.5px;padding:10px 14px;box-shadow:var(--shadow-md);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* formularios */
.seg{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=password],select,textarea{width:100%;padding:13px 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.l{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.btn{border:0;border-radius:15px;padding:14px 16px;font-weight:800;background:var(--grad);color:#fff;font-size:15.5px;box-shadow:0 6px 16px -6px rgba(164,77,240,.6)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.bad{background:transparent;color:var(--bad-ink);box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;margin-top:18px}.btns .btn{flex:1}
.backdrop{position:fixed;inset:0;background:rgba(15,14,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s ease}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet::before{content:"";display:block;width:48px;height:5px;background:#D6D4E3;border-radius:99px;margin:4px auto 12px}
.sheet-x{position:sticky;top:0;float:right;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--muted);font-size:17px;font-weight:800;margin:-6px -6px 0 8px;box-shadow:var(--shadow-sm)}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:15px;z-index:40;font-size:14px;font-weight:700;max-width:88%;box-shadow:var(--shadow-md)}
.hint{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.45}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* agregar inteligente */
.smart{display:flex;gap:8px;align-items:center}
.smart input{font-size:17px;font-weight:600}
.mic{flex:none;width:50px;height:50px;border-radius:15px;border:0;background:var(--soft);font-size:21px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(240,68,97,.2)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}
.chip{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--ink);border:0}
.preview{font-size:13px;color:var(--muted);margin-top:8px}
.preview b{color:var(--ink)}
details.more{margin-top:12px;background:var(--card);border-radius:18px;padding:4px 14px 14px;box-shadow:var(--shadow-sm)}
details.more summary{list-style:none;font-weight:800;font-size:14px;padding:12px 0 2px;color:var(--accent-ink)}
details.more summary::-webkit-details-marker{display:none}
.quick{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);color:var(--muted);font-weight:600;border:0;width:100%;text-align:left;margin-top:12px}
.quick b{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}

/* asistente, agenda, semana */
.ins{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ins:first-of-type{border-top:0}
.ins .ic{flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ins .tx{font-size:14px;line-height:1.4;font-weight:550}
.ins .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ev{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.ev:first-of-type{border-top:0}
.ev .hr{flex:none;width:54px;font-weight:800;font-size:13px}
.ev .dot{flex:none;width:4px;align-self:stretch;border-radius:4px}
.ev.now{background:color-mix(in srgb, var(--accent) 8%, transparent);border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:0;border-radius:16px;padding:8px 2px;background:var(--soft);text-align:center;color:var(--ink)}
.wd small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase}
.wd b{display:block;font-size:17px;font-weight:800;margin:1px 0}
.wd i{display:block;height:6px;border-radius:9px;margin:4px 8px 0;background:var(--line)}
.wd.today{background:var(--grad);color:#fff}.wd.today small{color:#fff;opacity:.9}
.wd.busy{background:repeating-linear-gradient(135deg,#EFEAFE 0 6px,#E4DDFD 6px 12px)}
.wd.today.busy{background:var(--grad)}
.busy-band{position:relative;z-index:1;background:rgba(255,255,255,.22);border-radius:14px;padding:8px 11px;font-size:13.5px;font-weight:700;margin:-4px 0 12px}
.sug{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.sug:first-of-type{border-top:0}
.sug .ic{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--soft)}
.sug .tt{font-weight:700;font-size:14.5px;line-height:1.3;word-break:break-word}
.sug .st{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.sq{flex:none;border:0;width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:800}
.sq.add{background:var(--grad);color:#fff}.sq.no{background:var(--soft);color:var(--muted)}

/* estadísticas */
.hb{margin:10px 0}.hb .n{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:600;gap:8px}
.hb .b{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.hb .b i{display:block;height:100%}
svg text{fill:var(--muted);font-size:9px;font-weight:600}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.badge{flex:none;width:76px;text-align:center;padding:10px 4px;border-radius:18px;background:var(--soft);opacity:.55}
.badge.on{opacity:1;background:var(--card);box-shadow:0 8px 18px -8px rgba(164,77,240,.5)}
.badge .ic{font-size:27px;display:block;margin-bottom:4px}
.badge .nm{font-size:10px;font-weight:800;line-height:1.2}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{border-radius:18px;padding:12px;color:#fff;border:0;text-align:left}
.qc b{font-size:24px;display:block;font-weight:800}
.qc span{font-size:11.5px;font-weight:700;opacity:.95;display:block;margin-top:2px}
.qbox{border-radius:18px;padding:10px 12px;margin:8px 0;border:2px solid var(--qc)}
.qbox h4{margin:0 0 4px;font-size:13px;color:var(--qc);font-weight:800}
.stats-toggle{width:100%;border:0;background:var(--card);border-radius:18px;padding:14px;font-weight:800;color:var(--ink);box-shadow:var(--shadow-sm);margin-top:12px;display:flex;justify-content:space-between;align-items:center}

/* tablero */
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.filters .pill{flex:none;white-space:nowrap}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:15px;margin:10px 0 2px}
.views button{border:0;background:none;border-radius:11px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--muted)}
.views button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.board{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;margin:0 -18px;padding-left:18px;padding-right:18px}
.col{flex:none;width:78%;max-width:300px;background:var(--soft);border-radius:20px;padding:10px;scroll-snap-align:start}
.col h4{margin:2px 4px 8px;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.kc{background:var(--card);border-radius:15px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--shadow-sm);border-left:4px solid var(--c)}
.kc .t{font-weight:700;font-size:14px;line-height:1.3}
.kc .mv{display:flex;justify-content:space-between;margin-top:8px}
.kc .mv button{white-space:nowrap;border:0;background:var(--soft);border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;color:var(--ink)}

/* hábitos y semana */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.heat i{display:block;padding-top:100%;border-radius:5px;background:var(--soft)}
.heat i.today{box-shadow:0 0 0 2px var(--ink) inset}
.habit-row{padding:14px 0;border-top:1px solid var(--line)}
.habit-row:first-of-type{border-top:0}
.habit-dot{width:34px;height:34px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px}
.checklist-item{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.checklist-item:first-of-type{border-top:0}
.checklist-item.done .ct{text-decoration:line-through;color:var(--muted)}
.weekcard{border-radius:16px;padding:12px;background:var(--soft);margin:8px 0}
textarea.note{min-height:56px;resize:vertical}
.proj{border-left:5px solid var(--c)}

/* base de contactos */
.ct-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ct-row:first-of-type{border-top:0}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.02em}
.ct-last{flex:none;text-align:right;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.35}
.tl{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.tl:first-of-type{border-top:0}
.tl .ic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:15px}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts3 a,.acts3 button{text-align:center;text-decoration:none;border:0;border-radius:14px;padding:11px 4px;background:var(--soft);color:var(--ink);font-weight:800;font-size:13px}
/* negociaciones */
.stages{display:flex;gap:2px;margin:12px 0 8px}
.stages button{flex:1;min-width:0;border:0;padding:9px 0 9px 6px;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--soft);clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%,14% 50%);white-space:nowrap;overflow:hidden}
.stages button:first-child{clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);padding-left:0}
.stages button.ok{background:color-mix(in srgb,var(--c) 30%,white);color:var(--ink)}
.stages button.on{background:var(--c);color:#fff}
.hd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.fun{display:flex;flex-direction:column;align-items:center;gap:2px}
.fun .fr{border-radius:12px;color:#fff;padding:8px 10px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;gap:6px;min-width:150px;box-sizing:border-box}
.fun .cv{font-size:11px;color:var(--muted);font-weight:800}
.mbar{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}
.mbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted);font-weight:700}
.mbar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--grad-green);min-height:3px}
.rec{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .ic{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:800;color:var(--ink)}
.deal{padding:12px 0;border-top:1px solid var(--line)}
.deal:first-of-type{border-top:0}
/* foco */
.timer{position:relative;width:220px;height:220px;margin:14px auto}
.timer b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer b span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:50;border-radius:2px;pointer-events:none;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.2}}

/* ---------- ⓘ qué significa ---------- */
.ib{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;font-weight:800;font-style:normal;font-family:Georgia,serif;opacity:.5;margin-left:6px;vertical-align:1px;cursor:pointer;line-height:1;flex:none}
[data-info]{cursor:pointer}
.pop-bg{position:fixed;inset:0;background:rgba(15,14,23,.45);z-index:45;display:flex;align-items:center;justify-content:center;padding:18px;animation:fd .15s ease}
.pop{background:var(--card);border-radius:22px;max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow-md);animation:up .2s ease}
.pop h4{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.pop p{margin:8px 0;font-size:14.5px;line-height:1.55}
.pop .lab{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.pop .calc{background:var(--soft);border-radius:14px;padding:6px 14px;font-size:13.5px}
.pop .calc .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.pop .calc .ln:first-child{border-top:0}
.pop .calc .ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pop .calc .ln.tot{font-weight:800}
/* ---------- negociaciones (pipeline tipo CRM) ---------- */
.nkpis{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.nkpi{flex:1 0 150px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.nkpi small{display:flex;align-items:center;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.nkpi b{display:block;font-size:21px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nkpi span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.ntool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
.ntool .views{margin:0;flex:none;display:flex}
.ntool .views button{padding:8px 12px}
.ntool input{flex:1 1 140px;width:auto;min-width:0;padding:11px 14px}
@media (max-width:999px){.ntool .views{width:100%}.ntool .views button{flex:1}}
.hstat span{white-space:nowrap}
.kb{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -18px 0;padding:4px 18px 14px}
.kcol{flex:none;width:85%;max-width:330px;background:var(--soft);border-radius:18px;scroll-snap-align:start;display:flex;flex-direction:column;overflow:hidden}
.kcol-h{background:var(--card);border-top:4px solid var(--c);padding:10px 14px 9px}
.kcol-h b{font-size:13.5px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.kcol-h small{display:flex;align-items:center;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.kcards{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:60px}
.kcard{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow-sm);cursor:pointer;border-left:4px solid transparent;transition:box-shadow .15s}
.kcard:hover{box-shadow:var(--shadow-md)}
.kcard.alert{border-left-color:var(--bad)}
.kcard .nm{font-weight:750;font-size:14.5px;line-height:1.3;word-break:break-word}
.kcard .pr{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35;word-break:break-word}
.kcard .vl{font-weight:800;font-size:14.5px;margin-top:7px;font-variant-numeric:tabular-nums}
.kcard .nx{font-size:12.5px;margin-top:7px;color:var(--info-ink);font-weight:650;line-height:1.35}
.kcard .nx.bad{color:var(--bad-ink)}
.kcard .meta{margin-top:8px}
.kcard .mv{display:flex;justify-content:space-between;margin-top:9px}
.kcard .mv button{border:0;background:var(--soft);border-radius:9px;padding:6px 11px;font-weight:800;font-size:12px;color:var(--ink)}
.kcard.drag{opacity:.35}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-3px}
.klist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.tablewrap{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);margin:10px 0}
.ntable{width:100%;border-collapse:collapse;font-size:14px}
.ntable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.ntable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.ntable tr:last-child td{border-bottom:0}
.ntable tr[data-neg]{cursor:pointer}
.ntable tr[data-neg]:hover td{background:var(--soft)}
.ntable .nx{font-size:13px;font-weight:650;color:var(--info-ink)}
.ntable .nx.bad{color:var(--bad-ink)}
.brand{display:none}
.dk{display:none}
.dk-only{display:none}
/* ---------- pantalla grande (PC): menú lateral y todo el ancho ---------- */
@media (min-width:1000px){
  body{padding-left:240px;padding-bottom:28px}
  .wrap{max-width:none;padding:0 36px}
  header.top{padding:24px 0 16px;background:var(--bg)}
  header.top h1{font-size:28px}
  nav.bottom{top:0;bottom:0;left:0;right:auto;width:240px;max-width:none;margin:0;border-radius:0;flex-direction:column;justify-content:flex-start;gap:3px;padding:20px 14px;background:var(--card);backdrop-filter:none;border:0;border-right:1px solid var(--line);box-shadow:none}
  nav.bottom .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-weight:800;font-size:15px;line-height:1.2;letter-spacing:-.01em}
  nav.bottom .brand img{width:36px;height:36px;border-radius:10px}
  nav.bottom .brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  nav.bottom button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:7px 10px;border-radius:13px;color:var(--ink);font-weight:650}
  nav.bottom button span{width:34px;height:34px;font-size:18px;filter:none;opacity:.9}
  nav.bottom button:hover{background:var(--soft)}
  nav.bottom button.on{background:var(--soft);color:var(--accent-ink);font-weight:800}
  nav.bottom button.on span{background:var(--card);box-shadow:var(--shadow-sm)}
  .fab{right:36px;bottom:36px}
  .focus-pill{left:276px;bottom:40px}
  .toast{bottom:40px;left:calc(50% + 120px)}
  .backdrop{justify-content:flex-end;align-items:stretch}
  .sheet{max-width:640px;max-height:none;height:100%;border-radius:0;padding:24px 30px 30px;animation:side .22s ease;box-shadow:-24px 0 48px -24px rgba(27,26,46,.35)}
  .sheet::before{display:none}
  .sheet-x{margin:-4px -6px 0 8px}
  .dash{columns:2 460px;column-gap:22px}
  .dash > *{break-inside:avoid}
  .dash > .card{margin:0 0 22px}
  .dash > .stats-toggle{margin:0 0 22px}
  .tiles{gap:14px}
  .tile{padding:16px 14px}
  .tile b{font-size:28px}
  .tile span{font-size:12px}
  .hero{padding:24px 26px}
  .kb{display:grid;grid-template-columns:repeat(var(--ncol,6),minmax(168px,1fr));overflow-x:auto;margin:4px 0 0;padding:4px 0 14px;scroll-snap-type:none}
  .kcol{width:auto;max-width:none;max-height:calc(100vh - 300px)}
  .kcards{overflow-y:auto;flex:1}
  .kcard .mv{display:none}
  .dk{display:block}
  .dk-only{display:block}
  .mob-only{display:none !important}
  .ct-row .dk{flex:none;width:200px;font-size:13px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ct-row{padding:12px 6px}
  .ct-row:hover{background:var(--soft);border-radius:12px}
}
@keyframes side{from{transform:translateX(48px);opacity:.4}}

/* ---------- rediseño: tarjetas, widgets, ventanas ---------- */
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{border-radius:16px;border:1px solid var(--line);box-shadow:none}
.card h2 .em{display:none}
.card h2{font-size:14.5px;font-weight:700}
.hero{background:var(--card)!important;color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:16px}
.hero::before,.hero::after{display:none}
.hero .hint{color:var(--muted)!important}
.hero .hstat{background:var(--soft)}
.tile{background:var(--card)!important;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn{box-shadow:none;border-radius:12px}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.pill{border-radius:10px;padding:7px 12px;font-weight:600}
.pill.on{background:var(--ink);border-color:var(--ink)}
.tag{border-radius:8px;font-weight:600}
.fab{border-radius:16px}
.quick{border:1px solid var(--line);box-shadow:none;border-radius:14px}
.quick b{background:var(--accent)}
.kpi{border:1px solid var(--line);box-shadow:none;border-top:3px solid var(--c,var(--accent))}
.nkpi,.kcard,.tablewrap{box-shadow:none;border:1px solid var(--line)}
.kcol{background:#EEF0F3}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
nav.bottom button span{filter:none!important}
nav.bottom button span .ico{width:21px;height:21px}
/* página de inicio en widgets */
.ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
.ihead .quick{margin:0;flex:1 1 260px}
.ihead .btn{flex:none}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.w{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.w.span2{grid-column:span 2}
@media (max-width:560px){.wgrid{grid-template-columns:1fr 1fr;gap:10px}.w{padding:14px;grid-column:1/-1}.w.half{grid-column:auto}.w.half .hbar{grid-template-columns:auto 1fr;}.w.half .hbar b{display:none}header.top h1{font-size:21px}}
.wh{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700;font-size:14.5px}
.wh .ico{color:var(--muted)}
.wh .go{margin-left:auto;border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:13px;padding:2px 0;cursor:pointer}
.wbig{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.wsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.wring{display:flex;align-items:center;gap:14px}
.wring .rg{position:relative;flex:none}
.wring .rg b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.wring .rg b small{font-size:10.5px;color:var(--muted);font-weight:600}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.leg div{display:flex;align-items:center;gap:7px;white-space:nowrap}
.leg i{width:8px;height:8px;border-radius:50%;flex:none}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:8px}
.hbar{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:10px}
.hbar span{color:var(--muted);white-space:nowrap}
.hbar b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.hbar .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);gap:2px;margin:10px 0 8px}
.meter i{display:block;height:100%}
.wl{display:flex;flex-direction:column}
.wl .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.wl .it:first-child{border-top:0;padding-top:2px}
.wl .it .tx{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.wl .it .tx small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .it .rt{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;position:relative;margin-top:6px}
.bars i{flex:1;background:var(--s2);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i.hit{background:var(--accent)}
.bars i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);background:var(--ink);color:#fff;font-size:11px;padding:3px 6px;border-radius:6px;white-space:nowrap;z-index:2}
.bars u{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.bx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.sug2{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.sug2:first-child{border-top:0;padding-top:2px}
.sug2 .tx{flex:1;font-size:13.5px;line-height:1.4}
.sug2 .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sug2 .acts .btn{padding:6px 10px;font-size:12.5px}
/* ventanas emergentes */
.pop.wide{max-width:640px}
.pop .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pop .ph h4{flex:1;margin:0}
.pop .px{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--muted);cursor:pointer}
@media (max-width:560px){.pop-bg{align-items:flex-end;padding:0}.pop{border-radius:20px 20px 0 0;max-height:90vh}}
/* tarjeta de negociación simple */
.kcard .top{display:flex;gap:8px;align-items:baseline}
.kcard .top .nm{flex:1;min-width:0}
.kcard .kv{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kcard .pr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .kf{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.kcard .kf .ktx{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.kcard .kf{align-items:flex-start}
.kcard .kf .ico{margin-top:1px}
.kcard .kf.bad{color:var(--bad-ink);font-weight:600}
.kcard .kp{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.kcard .ks{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
/* ficha de negociación */
.dh{display:flex;gap:12px;align-items:center;margin:2px 0 12px}
.dh h3{margin:0;font-size:20px}
.dh .ds{color:var(--muted);font-size:13.5px;margin-top:2px}
.stepper{display:flex;gap:3px;margin:4px 0 4px}
.stepper button{flex:1;min-width:0;border:0;padding:10px 0 10px 8px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--soft);clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,12% 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.stepper button:first-child{clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);padding-left:0}
.stepper button.ok{background:var(--accent-soft);color:var(--accent-ink)}
.stepper button.on{background:var(--accent);color:#fff}
.stepper button:hover:not(.on){background:#DCE7F6}
.shint{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.dact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.dact button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);cursor:pointer}
.dact button .ico{width:20px;height:20px;color:var(--accent)}
.dact button.win .ico{color:var(--ok)}
.dact button.lose .ico{color:var(--bad)}
.dact button:hover{background:var(--soft)}
.nextc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--card);display:flex;gap:10px;align-items:center;margin-bottom:14px}
.nextc.bad{border-left-color:var(--bad)}
.nextc .tx{flex:1;min-width:0}
.nextc .tx small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nextc .tx b{display:block;font-size:14.5px;margin-top:2px}
.nextc .tx span{font-size:12.5px;color:var(--muted)}
.nextc.bad .tx span{color:var(--bad-ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini3 div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.mini3 small{display:flex;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.mini3 b{display:block;font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.sth{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.sth:first-child{border-top:0}
.sth .bar{flex:1}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.choice button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- pestañas rediseñadas ---------- */
.task .t{font-weight:600}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.tm .d{font-weight:600;color:var(--ink)}
.tm .d.bad{color:var(--bad-ink)} .tm .d.warn{color:var(--warn-ink)} .tm .d.ok{color:var(--ok-ink)}
.task .why{color:var(--muted);font-weight:600}
.play{background:var(--soft);color:var(--accent-ink)}
.kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}

const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pd(s){ return new Date(s + 'T12:00:00'); }
function addDays(s, n){ const d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function diffDays(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function fmt(s){ if(!s) return 'Sin fecha'; const d = pd(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; }
function fmtRel(s){ const n = diffDays(hoy(), s); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n === -1 ? 'Ayer' : fmt(s); }

const OPS_CAMBIO = ['subtareas', 'repetir', 'siguiente'];
async function api(action, extra){
  if (['add', 'update', 'toggle', 'delete'].includes(action) || (action === 'extra' && OPS_CAMBIO.includes(extra && extra.op))) S.mutado = true;
  const res = await fetch(LS.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: LS.token, action }, extra || {})) });
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('respuesta'); }
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
function apiX(op, extra){ return api('extra', Object.assign({ op }, extra || {})); }

/* ---------- lógica: listas y prioridad inteligente ---------- */
function pendientes(){ return S.data.tareas.filter(t => !t.hecho); }
function hechasEl(dia){ return S.data.tareas.filter(t => t.hecho && (t.cierre || '').slice(0, 10) === dia); }
function vencidas(){ const h = hoy(); return pendientes().filter(t => t.limite && t.limite < h); }
function paraHoy(){ const h = hoy(); return pendientes().filter(t => (t.limite && t.limite <= h) || t.estado === 'En curso'); }
function ordenar(a, b){
  const ca = quadOf(a), cb = quadOf(b);
  if (ca !== cb) return ca - cb;
  return (a.limite || '9999').localeCompare(b.limite || '9999');
}
// Puntaje: mezcla vencimiento, cuadrante de Eisenhower y estado para sugerir qué hacer primero.
function puntaje(t){
  const h = hoy(); let s = 0, why = '';
  if (t.limite){
    const d = diffDays(h, t.limite);
    if (d < 0){ s += 50 + Math.min(30, -d * 4); why = 'Vencida hace ' + (-d) + (d === -1 ? ' día' : ' días'); }
    else if (d === 0){ s += 42; why = 'Vence hoy'; }
    else if (d === 1){ s += 16; why = 'Vence mañana'; }
    else if (d <= 3){ s += 8; why = 'Vence ' + fmt(t.limite); }
  }
  const q = quadOf(t); s += { 1: 32, 2: 18, 3: 10, 4: 0 }[q];
  if (!why && q === 1) why = 'Urgente e importante';
  if (t.estado === 'En curso'){ s += 22; why = why || 'Ya la empezaste'; }
  if (t.estado === 'Esperando respuesta' || t.estado === 'Pausada') s -= 45;
  const hr = new Date().getHours();
  if (hr < 12 && t.tamano === 'Grande') s += 5;
  if (hr >= 16 && t.tamano === 'Pequeña'){ s += 5; why = why || 'Rápida para cerrar el día'; }
  if (!why) why = q === 2 ? 'Importante: avanza antes de que sea urgente' : 'Buen momento para sacarla';
  return { s, why };
}
// Días ocupados: eventos de día completo (o de 5 horas o más) en tu calendario, como una capacitación.
function minutosHHMM(t){ const p = String(t || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function ocupados(){
  const m = {}, g = S.google;
  if (!g || !g.eventos) return m;
  g.eventos.forEach(e => {
    const largo = e.todoElDia || (e.inicio && e.fin && minutosHHMM(e.fin) - minutosHHMM(e.inicio) >= 300);
    if (!largo) return;
    let d = e.fecha; const fin = e.fechaFin || e.fecha;
    for (let i = 0; i < 31 && d <= fin; i++){ if (!m[d]) m[d] = e; d = addDays(d, 1); }
  });
  return m;
}
function proximoLibre(desde){
  const oc = ocupados(); let d = addDays(desde, 1);
  for (let i = 0; i < 30; i++){ if (!oc[d] && pd(d).getDay() !== 0) return d; d = addDays(d, 1); }
  return addDays(desde, 1);
}
// Tareas no urgentes que caen en un día ocupado (hoy incluye las vencidas).
function tareasEnDiaOcupado(d){ const h = hoy(); return pendientes().filter(t => quadOf(t) !== 1 && t.estado !== 'En curso' && (t.limite === d || (d === h && t.limite && t.limite < h))); }
function enfoque(n){ return pendientes().map(t => Object.assign({ t }, puntaje(t))).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, n); }

/* ---------- componentes ---------- */
function tagFecha(t){
  if (t.hecho) return '<span class="tag ok">✅ Hecha</span>';
  if (!t.limite) return '';
  const h = hoy();
  if (t.limite < h) return '<span class="tag bad">⏰ Vencida · ' + fmt(t.limite) + '</span>';
  if (t.limite === h) return '<span class="tag warn">☀️ Hoy</span>';
  if (t.limite === addDays(h, 1)) return '<span class="tag info">📅 Mañana</span>';
  return '<span class="tag">📅 ' + fmt(t.limite) + '</span>';
}
function fechaTxt(t){
  if (t.hecho) return ['ok', 'Hecha'];
  if (!t.limite) return ['', ''];
  const h = hoy();
  if (t.limite < h) return ['bad', 'Vencida ' + fmt(t.limite)];
  if (t.limite === h) return ['warn', 'Hoy'];
  if (t.limite === addDays(h, 1)) return ['', 'Mañana'];
  return ['', fmt(t.limite)];
}

/* ---------- calendario y correo: sugerencias ---------- */
function sugerencias(){
  const g = S.google; if (!g || g.inactivo) return [];
  const listo = lsGet('sugListas', {}), h = hoy();
  const titulos = new Set(S.data.tareas.map(t => norm(t.tarea)));
  const notas = S.data.tareas.map(t => t.notas || '').join(' ');
  const out = [];
  (g.eventos || []).forEach(e => {
    if (listo[e.id] || e.fecha < h) return;
    if (titulos.has(norm(e.titulo)) || notas.includes(e.id)) return;
    out.push({ id: e.id, tipo: 'evento', ic: '📅', titulo: e.titulo, sub: fmtRel(e.fecha) + (e.inicio ? ' · ' + e.inicio : ' · todo el día') + (e.lugar ? ' · 📍 ' + e.lugar : '') + ' · ' + e.calendario,
      tarea: { tarea: e.titulo, limite: e.fecha, notas: '📅 ' + (e.inicio ? e.inicio + (e.fin ? '–' + e.fin : '') : 'todo el día') + (e.lugar ? ' · ' + e.lugar : '') } });
  });
  (g.correos || []).forEach(c => {
    if (listo[c.id] || notas.includes(c.id)) return;
    const asunto = String(c.asunto).replace(/^((re|rv|fw|fwd)\s*:\s*)+/i, '');
    const titulo = 'Responder: ' + asunto;
    if (titulos.has(norm(titulo))) return;
    out.push({ id: c.id, tipo: 'correo', ic: c.motivo === 'destacado' ? '⭐' : '✉️', titulo: asunto, sub: c.de + ' · ' + fmtRel(c.fecha) + (c.resumen ? ' · ' + c.resumen.slice(0, 70) + '…' : ''),
      tarea: { tarea: titulo, limite: h, notas: '✉️ ' + c.de + ' · ' + c.link } });
  });
  return out;
}

// Lee un chat exportado desde WhatsApp («Exportar chat → Sin archivos»), formatos de Android y iPhone:

const RE_LINEA = /^\[?(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?\.?\s?m?\.?\]?\s*(?:[-–]\s*)?([^:]{1,60}?):\s([\s\S]*)$/i;

function leerChatWhatsApp(txt){

    const l = linea.replace(/[‎‏‪-‮]/g, ''), m = l.match(RE_LINEA);

    else if (crudos.length && l.trim()) crudos[crudos.length - 1].extra = (crudos[crudos.length - 1].extra || '') + '\n' + l;
  });

  const anio = y => (+y < 100 ? +y + 2000 : +y);

  if (crudos.some(c => +c.m[1] > 12)) diaPrimero = true;
  else if (crudos.some(c => +c.m[2] > 12)) diaPrimero = false;
  else {
    const manana = addDays(hoy(), 1), fut = dp => crudos.filter(c => { const d = dp ? +c.m[1] : +c.m[2], mo = dp ? +c.m[2] : +c.m[1]; return anio(c.m[3]) + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0') > manana; }).length;
    const desorden = dp => { let n = 0, prev = ''; crudos.forEach(c => { const d = dp ? +c.m[1] : +c.m[2], mo = dp ? +c.m[2] : +c.m[1], f = anio(c.m[3]) + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'); if (f < prev) n++; prev = f; }); return n; };
    const a = fut(true) * 1000 + desorden(true), b = fut(false) * 1000 + desorden(false);

  crudos.forEach(c => {
    const m = c.m;

    if (/^(se eliminó este mensaje|este mensaje fue eliminado|you deleted this message|null)$/i.test(texto)) return;
    mensajes.push({ autor, fecha: y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T' + String(h).padStart(2, '0') + ':' + m[5], texto });
    autores[autor] = (autores[autor] || 0) + 1;
  });
  return { mensajes, autores, diaPrimero };
}

async function leerArchivoChat(blob, nombre){
  const buf = new Uint8Array(await blob.arrayBuffer());
  const limpio = n => String(n || '').replace(/\.(zip|txt)$/i, '');

    pos += 46 + ln + le + lc;
  }

  const e = txts.find(x => /_chat\.txt$|chat de whatsapp|whatsapp chat/i.test(x.n)) || txts.sort((a, b) => b.tam - a.tam)[0];
  const ini = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true), datos = buf.subarray(ini, ini + e.tam);

  if (e.metodo === 0) bytes = datos;
  else if (e.metodo === 8){
    if (typeof DecompressionStream === 'undefined') throw new Error('este navegador no descomprime .zip; descomprímelo y sube el .txt');
    bytes = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  } else throw new Error('formato de .zip no soportado');

  return { txt: utf.decode(bytes), nombre: /^_?chat$/i.test(interno) ? limpio(nombre) : interno };
}

async function revisarCompartido(){
  if (!/[?&]compartido=1/.test(location.search)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('compartido'), claves = (await cache.keys()).filter(k => /chat\.bin/.test(k.url));
    const files = [];
    for (const k of claves){ const rb = await cache.match(k); files.push(new File([await rb.blob()], decodeURIComponent(rb.headers.get('x-nombre') || 'chat.txt'))); await cache.delete(k); }
    const r = files.length ? null : await cache.match('chat.json');
    if (!files.length && !r) return;
    let abrir;
    if (files.length > 1) abrir = () => openImportar({ files });
    else {
      const d = files.length ? await leerArchivoChat(files[0], files[0].name) : await r.json();
      if (!files.length) await cache.delete('chat.json');
      abrir = () => openImportar({ txt: d.txt, nombre: d.nombre });
    }
    if (S.data) abrir(); else setTimeout(abrir, 1500);
  } catch(e){ toast('No pude leer el chat compartido: ' + e.message); }
}

const FMT_IG = { REELS: 'Reel', FEED: 'Post / carrusel', STORY: 'Historia' };
function igMetricas(){
  const I = S.ig || { dias: [], posts: [] }, D = I.dias || [], h = hoy();
  const ult = D.slice(-28), prev = D.slice(-56, -28), sum = (L, k) => L.reduce((s, d) => s + (+d[k] || 0), 0);
  const conSeg = D.filter(d => d.seguidores !== '' && d.seguidores != null), seg = conSeg.length ? +conSeg[conSeg.length - 1].seguidores : null;
  const seg30 = conSeg.filter(d => d.fecha <= addDays(h, -28)), segAntes = seg30.length ? +seg30[seg30.length - 1].seguidores : null;
  const alc = sum(ult, 'alcance'), inter = sum(ult, 'interacciones');
  const P = (I.posts || []).filter(x => x.fecha.slice(0, 10) >= addDays(h, -90));
  const porFmt = {}; P.forEach(x => { const k = FMT_IG[x.formato] || x.formato || 'Otro'; (porFmt[k] = porFmt[k] || []).push(x); });
  const porDia = [0, 1, 2, 3, 4, 5, 6].map(d => { const L = P.filter(x => pd(x.fecha.slice(0, 10)).getDay() === d); return { d, n: L.length, prom: L.length ? L.reduce((s, x) => s + x.interacciones, 0) / L.length : 0 }; });
  return { D, seg, dSeg: seg != null && segAntes != null ? seg - segAntes : null, alc, alcPrev: sum(prev, 'alcance'), inter, tasa: alc ? inter / alc : null, P, porFmt, porDia, links: sum(ult, 'links') };
}

async function negAccion(acc, n, btn){
  const a = analizar(n), c = a.c;
  if (acc.startsWith('wa:')){
    const txt = plantilla(acc.slice(3), n, a), tel = c ? String(c.telefono || '').replace(/[^\d+]/g, '').replace(/^\+/, '').replace(/^9(\d{8})$/, '569$1') : '';
    if (tel) window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(txt), '_blank');
    else if (c && c.email) window.open('mailto:' + c.email + '?subject=' + encodeURIComponent(n.producto || n.titulo) + '&body=' + encodeURIComponent(txt), '_blank');
    else { try { await navigator.clipboard.writeText(txt); toast('Mensaje copiado: agrega el teléfono del contacto para abrir WhatsApp directo'); } catch(e){ toast(txt); } }
    return negRegistrar(n, '💬 Mensaje', 'Mensaje enviado: ' + txt.slice(0, 80) + '…', 'Contactado');
  }
  if (acc.startsWith('etapa:')) return moverEtapa(n, acc.slice(6));
  if (acc === 'perdida') return openPerdida(n);
  if (acc === 'prox' || acc === 'reagendar' || acc === 'cierre14' || acc === 'hecho-prox'){
    if (acc === 'prox') return openNegocio(n, { foco: 'prox' });
    if (btn) btn.disabled = true;
    const cambios = acc === 'reagendar' ? { fechaProx: addDays(hoy(), 2) } : acc === 'cierre14' ? { cierre: addDays(hoy(), 14) } : { proxima: '', fechaProx: '' };
    try {
      if (acc === 'hecho-prox') await apiX('negocioNota', { id: n.id, texto: '✅ ' + n.proxima, tipo: '✅ Acción' });
      await apiX('negocio', { negocio: Object.assign({ id: n.id }, cambios) }); await loadNeg(true);
      toast(acc === 'hecho-prox' ? '✅ Registrado. Define el siguiente paso' : 'Actualizado ✓');
      const n2 = negocios().find(x => x.id === n.id);
      if (acc === 'hecho-prox' && n2) return openNegocio(n2, { foco: 'prox' });
      refrescarNeg(n2);
    } catch(e){ if (btn) btn.disabled = false; toast('No se pudo: ' + e.message); }
    return;
  }
  if (acc === 'testride'){
    const d = addDays(hoy(), 2).replace(/-/g, '');
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('🚵 Test ride ' + (c ? c.nombre : n.titulo)) + '&dates=' + d + 'T110000/' + d + 'T120000&ctz=America/Santiago&details=' + encodeURIComponent(negTag(n)), '_blank');
    return toast('Ajusta día y hora en Calendar y guarda. Al hacerlo, toca «🚵 Hizo test ride» aquí.');
  }
  if (acc === 'tarea:cotizacion') return openAdd({ texto: 'Enviar cotización ' + (n.producto || '') + ' a ' + (c ? c.nombre : n.titulo) + ' mañana', notas: negTag(n) });
}

// Métricas del tablero: pipeline, pronóstico ponderado, tasa de cierre, ciclo de venta, ticket y conversión por etapa.
function metricasNeg(){
  const h = hoy(), N = negocios(), A = abiertos(), mes = h.slice(0, 7);
  const fechaFin = n => { const hi = historialDe(n); return hi.length ? hi[hi.length - 1].f : n.actividad; };
  const ganadas = N.filter(n => n.estado === 'Ganada'), perdidas = N.filter(n => n.estado === 'Perdida');
  const g90 = ganadas.filter(n => diffDays(fechaFin(n), h) <= 90), p90 = perdidas.filter(n => diffDays(fechaFin(n), h) <= 90);
  const gMes = ganadas.filter(n => (fechaFin(n) || '').slice(0, 7) === mes);
  const an = A.map(n => ({ n, a: analizar(n) }));
  const ciclo = ganadas.map(n => diffDays(n.creada || fechaFin(n), fechaFin(n))).filter(x => x >= 0);
  const alcanzo = ETAPAS.map((e, i) => N.filter(n => n.estado === 'Ganada' || historialDe(n).some(x => etapaIdx(x.e) >= i) || etapaIdx(n.etapa) >= i).length);
  const meses = [];
  for (let i = 5; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = iso(d).slice(0, 7); meses.push({ k, nom: MESES[d.getMonth()], v: ganadas.filter(n => (fechaFin(n) || '').slice(0, 7) === k).reduce((s, n) => s + (n.valor || 0), 0) }); }
  const motivos = {}; perdidas.forEach(n => { const m = String(n.motivo || 'Sin motivo').split(' · ')[0]; motivos[m] = (motivos[m] || 0) + 1; });
  return {
    an, abiertoV: A.reduce((s, n) => s + (n.valor || 0), 0), ponderado: an.reduce((s, x) => s + (x.n.valor || 0) * x.a.prob, 0),
    gMes, gMesV: gMes.reduce((s, n) => s + (n.valor || 0), 0), tasa: g90.length + p90.length ? g90.length / (g90.length + p90.length) : null,
    ciclo: ciclo.length ? Math.round(ciclo.reduce((s, x) => s + x, 0) / ciclo.length) : null,
    ticket: ganadas.length ? ganadas.reduce((s, n) => s + (n.valor || 0), 0) / ganadas.length : null,
    estancadas: an.filter(x => x.a.estancada), alcanzo, meses, motivos,
    g90: g90.length, p90: p90.length, nGan: ganadas.length, totalGan: ganadas.reduce((s, n) => s + (n.valor || 0), 0)
  };
}

function negsParaSeguir(t){

async function accionBloque(acc, btn){
  const L = [...S.sel]; if (!L.length){ toast('Selecciona una o más tareas'); return; }
  const h = hoy(); btn.disabled = true;
  try {
    if (acc === 'hecha') for (const t of L) if (!t.hecho) await toggle(t);
    else if (acc === 'del') for (const t of L.sort((x, y) => (y.row || 0) - (x.row || 0))) await api('delete', { row: t.row, tarea: t.tarea });
    else { const f = acc === 'hoy' ? h : acc === 'man' ? addDays(h, 1) : nextMonday(h); for (const t of L) await updateTask(t, { limite: f }); }
    toast('✓ ' + L.length + ' tareas actualizadas'); S.sel = null; await load();
  } catch(e){ btn.disabled = false; toast('No se pudo: ' + e.message); }
}

function chartDias(dias){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 150, pad = 18, n = dias.length, bw = (W - pad * 2) / n;
  const max = Math.max(4, ...dias.map(x => x.completadas), ...dias.map(x => x.meta || 0));
  const y = v => H - 22 - (v / max) * (H - 40);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A44DF0"/><stop offset="1" stop-color="#6D5DFC"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD2A8"/><stop offset="1" stop-color="#13B386"/></linearGradient></defs>';
  dias.forEach((x, i) => {
    const bx = pad + i * bw + 3, bh = (H - 22) - y(x.completadas);
    s += '<rect x="' + bx + '" y="' + y(x.completadas) + '" width="' + (bw - 6) + '" height="' + Math.max(0, bh) + '" rx="4" fill="' + (x.completadas >= x.meta && x.meta > 0 ? 'url(#gg)' : 'url(#gb)') + '"/>';
    if (x.completadas) s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (y(x.completadas) - 3) + '" text-anchor="middle">' + x.completadas + '</text>';
    s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + pd(x.fecha).getDate() + '</text>';
  });
  const meta = dias[dias.length - 1].meta;
  if (meta) s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(meta) + '" y2="' + y(meta) + '" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/><text x="' + (W - pad) + '" y="' + (y(meta) - 3) + '" text-anchor="end">meta ' + meta + '</text>';
  return s + '</svg>';
}
function chartLine(dias, key, color){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 130, pad = 18, n = dias.length;
  const vals = dias.map(x => x[key] || 0), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const x = i => pad + i * (W - pad * 2) / Math.max(1, n - 1);
  const y = v => H - 20 - ((v - min) / (max - min || 1)) * (H - 34);
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = 'M' + x(0) + ',' + (H - 20) + ' L' + pts.replace(/ /g, ' L') + ' L' + x(n - 1) + ',' + (H - 20) + ' Z';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  s += '<path d="' + area + '" fill="' + hexToRgba(color, .16) + '" stroke="none"/>';
  s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  dias.forEach((d, i) => { if (i === n - 1 || i % Math.ceil(n / 6) === 0) s += '<text x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="middle">' + pd(d.fecha).getDate() + '</text>'; });
  s += '<circle cx="' + x(n - 1) + '" cy="' + y(vals[n - 1]) + '" r="4" fill="' + color + '"/>';
  return s + '</svg>';
}

async function guardarSemana(actual, silencio){
  if (!actual) return;

  if (!Object.keys(campos).length) return;
  const cambio = Object.keys(campos).some(k => String(actual[k] || '') !== String(campos[k] || ''));
  if (!cambio){ if (!silencio) toast('Sin cambios'); return; }
  try { await api('semanaGuardar', { row: actual.row, campos }); Object.assign(actual, campos); if (!silencio) toast('Guardado ✓'); }
  catch(e){ toast('No se pudo guardar: ' + e.message); }
}

/* ---------- hojas modales ---------- */
// Hojas que suben desde abajo: se cierran con ✕, tocando fuera, deslizando hacia abajo o con «atrás».
let hojaEnHistorial = false, ignorarPop = false;
function sheet(html){
  const layer = $('#layer'), yaAbierta = !!layer.innerHTML;
  layer.innerHTML = '<div class="backdrop"><div class="sheet"><button class="sheet-x" aria-label="Cerrar">✕</button>' + html + '</div></div>';
  const bd = layer.firstChild, sh = bd.firstChild;
  bd.onclick = e => { if (e.target === bd) closeSheet(); };
  sh.querySelector('.sheet-x').onclick = () => closeSheet();
  deslizarParaCerrar(sh);
  if (!yaAbierta && !hojaEnHistorial){ try { history.pushState({ hoja: 1 }, ''); hojaEnHistorial = true; } catch(e){} }
  return layer;
}
function deslizarParaCerrar(sh){
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && sh.scrollTop <= 0){ sh.style.transform = 'translateY(' + dy + 'px)'; if (e.cancelable) e.preventDefault(); }
    else { y0 = null; sh.style.transform = ''; }
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90){ sh.style.transform = 'translateY(100%)'; setTimeout(() => closeSheet(), 170); }
    else sh.style.transform = '';
  });
}

const STOP = new Set('para con por que del los las una uno unos unas sin sobre entre desde hasta este esta estos estas como mas hay ser hoy manana tarea hacer'.split(' '));
function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w)); }
// Aprende de tus tareas: qué palabras usas en cada categoría. Suma palabras clave del rubro.
function adivinar(texto){
  const c = S.data.config, cats = c.categorias.map(x => x.nombre), w = tokens(texto);
  if (!w.length) return {};
  const sc = {};
  S.data.tareas.forEach(t => { if (!t.categoria || !cats.includes(t.categoria)) return; const tw = tokens(t.tarea); w.forEach(x => { if (tw.includes(x)) sc[t.categoria] = (sc[t.categoria] || 0) + 2; }); });
  Object.entries(SEMILLAS).forEach(([cat, sem]) => { if (!cats.includes(cat)) return; w.forEach(x => { if (sem.some(s => x === s || (s.length >= 4 && x.startsWith(s)))) sc[cat] = (sc[cat] || 0) + 3; }); });
  const best = Object.entries(sc).sort((a, b) => b[1] - a[1])[0];
  if (!best || best[1] < 2) return {};
  const cat = c.categorias.find(x => x.nombre === best[0]);
  return { categoria: cat.nombre, area: cat.area };
}
const WD_N = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const MES_N = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Entiende frases como «llamar a Crank mañana a las 10 urgente #ventas».
function parseTarea(txt){
  const h = hoy(), r = { repetir: null, limite: null, urgente: null, importante: null, tamano: null, categoria: null, area: null, proyecto: null, hora: null };
  let n = norm(txt); const cortes = [];
  const B = '(?=[\\s,.;]|$)';
  const regla = (re, fn) => { const m = new RegExp('(^|\\s)(' + re + ')' + B).exec(n); if (!m) return false; const ini = m.index + m[1].length, fin = ini + m[2].length; if (fn(m.slice(2)) === false) return false; cortes.push([ini, fin]); n = n.slice(0, ini) + ' '.repeat(fin - ini) + n.slice(fin); return true; };
  const fecha = f => { if (!r.limite) r.limite = f; };
  const rep = v => () => { r.repetir = v; };
  regla('(?:cada|todos los|todas las) (lunes|martes|miercoles|jueves|viernes|sabado|domingo)', m => { r.repetir = 'Semanal'; fecha(addDays(h, (WD_N.indexOf(m[1]) - pd(h).getDay() + 7) % 7)); }) ||
  regla('de lunes a viernes|(?:todos los |cada )?dias? habil(?:es)?', rep('Días hábiles')) ||
  regla('todos los dias|cada dia|diariamente|diari[ao]', rep('Diaria')) ||
  regla('cada 15 dias|cada dos semanas|quincenal(?:mente)?', rep('Quincenal')) ||
  regla('cada semana|todas las semanas|semanal(?:mente)?', rep('Semanal')) ||
  regla('cada mes|todos los meses|mensual(?:mente)?', rep('Mensual')) ||
  regla('cada ano|todos los anos|anual(?:mente)?', rep('Anual'));
  regla('(?:para )?pasado manana', () => fecha(addDays(h, 2))) ||
  regla('(?:para )?hoy', () => fecha(h)) ||
  regla('(?:para )?manana', () => fecha(addDays(h, 1))) ||
  regla('en (\\d{1,2}) (dias?|semanas?)', m => fecha(addDays(h, (+m[1]) * (m[2].startsWith('sem') ? 7 : 1)))) ||
  regla('(?:la )?(?:proxima|otra) semana', () => fecha(nextMonday(h))) ||
  regla('(?:este |el )?(?:fin de semana|finde)', () => { const d = pd(h).getDay(); fecha(addDays(h, d === 6 ? 0 : (6 - d + 7) % 7)); }) ||
  regla('(?:el |este |proximo |el proximo )?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)', m => { const w = WD_N.indexOf(m[1]); let k = (w - pd(h).getDay() + 7) % 7; if (k === 0) k = 7; fecha(addDays(h, k)); }) ||
  regla('(?:el |para el )?(\\d{1,2})[/\\-](\\d{1,2})(?:[/\\-](\\d{2,4}))?', m => {
    const dd = +m[1], mm = +m[2]; if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return false;
    let yy = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : pd(h).getFullYear();
    let f = iso(new Date(yy, mm - 1, dd)); if (!m[3] && f < h) f = iso(new Date(yy + 1, mm - 1, dd)); fecha(f);
  }) ||
  regla('(?:el |para el )?(\\d{1,2}) (?:de )?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*', m => {
    const dd = +m[1], mm = MES_N.indexOf(m[2]); if (dd < 1 || dd > 31) return false;
    const yy = pd(h).getFullYear(); let f = iso(new Date(yy, mm, dd)); if (f < h) f = iso(new Date(yy + 1, mm, dd)); fecha(f);
  });
  regla('(?:a las |a la )(\\d{1,2})(?::(\\d{2}))?(?: ?(?:hrs?|h))?|(\\d{1,2}):(\\d{2})(?: ?(?:hrs?|h))?|(\\d{1,2}) ?(am|pm|hrs)', m => {
    let hh = +(m[1] || m[3] || m[5]), mi = m[2] || m[4] || '00';
    if (m[6] === 'pm' && hh < 12) hh += 12; if (hh > 23) return false; r.hora = String(hh).padStart(2, '0') + ':' + mi;
  });
  regla('urgente|!+|asap', () => { r.urgente = 'Sí'; });
  regla('importante|\\*', () => { r.importante = 'Sí'; });
  const c = S.data.config;
  let m; const tagRe = /(^|\s)#([a-z0-9_\-]+)/;
  while ((m = tagRe.exec(n))){
    const k = m[2], ini = m.index + m[1].length, fin = ini + m[2].length + 1;
    const area = c.areas.find(a => norm(a).startsWith(k));
    const cat = c.categorias.find(x => norm(x.nombre).replace(/\s+/g, '').startsWith(k.replace(/[-_]/g, '')));
    const tam = c.tamanos.find(x => norm(x.nombre).startsWith(k));
    if (area) r.area = area; else if (cat){ r.categoria = cat.nombre; r.area = cat.area; } else if (tam) r.tamano = tam.nombre;
    cortes.push([ini, fin]); n = n.slice(0, ini) + ' '.repeat(fin - ini) + n.slice(fin);
  }
  const atRe = /(^|\s)@([a-z0-9_\-]+)/;
  if ((m = atRe.exec(n))){
    const p = S.data.proyectos.find(x => norm(x.nombre).replace(/\s+/g, '').includes(m[2]));
    if (p){ r.proyecto = p.nombre; const ini = m.index + m[1].length; cortes.push([ini, ini + m[2].length + 1]); }
  }
  let titulo = txt; cortes.sort((a, b) => b[0] - a[0]).forEach(([a, b]) => { titulo = titulo.slice(0, a) + titulo.slice(b); });

  return r;
}

// Dictado por voz (Chrome en Android lo soporta).
function dictar(input, btn, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR(); rec.lang = 'es-CL'; rec.interimResults = true; rec.maxAlternatives = 1;
  const base = input.value ? input.value.trim() + ' ' : '';
  btn.classList.add('on');
  rec.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = base + t; cb(); };
  rec.onerror = e => { btn.classList.remove('on'); if (e.error === 'not-allowed') toast('Permite el micrófono para dictar'); };
  rec.onend = () => btn.classList.remove('on');
  try { rec.start(); } catch(e){ btn.classList.remove('on'); }
}

function bindSubtareas(t){
  let subs = (t.subtareas || []).map(x => Object.assign({}, x));
  const guardar = async () => {
    t.subtareas = subs.map(x => Object.assign({}, x));
    try { await apiX('subtareas', { row: t.row, tarea: t.tarea, subtareas: subs }); }
    catch(e){ toast('No se pudo guardar: ' + e.message); }
  };
  const pintar = () => {
    const n = subs.filter(x => x.ok).length;
    $('#e_subs').innerHTML = (subs.length ? '<div class="bar" style="margin:10px 0 4px"><i style="width:' + (n / subs.length * 100) + '%;background:var(--ok)"></i></div>' : '') +
      (subs.length ? subs.map((x, i) => '<div class="checklist-item ' + (x.ok ? 'done' : '') + '"><button class="chk ' + (x.ok ? 'on' : '') + '" style="--q:#13B386" data-si="' + i + '">' + (x.ok ? '✓' : '') + '</button><span class="ct grow">' + esc(x.t) + '</span><button class="sq no" style="width:30px;height:30px;font-size:13px" data-sx="' + i + '" aria-label="Quitar">✕</button></div>').join('')
        : '<div class="hint">Divide la tarea en pasos pequeños: es más fácil partir.</div>');
    $$('[data-si]').forEach(b => b.onclick = () => {
      const x = subs[+b.dataset.si]; x.ok = !x.ok; pintar(); guardar();

    });

/* ---------- modo foco (pomodoro) ---------- */
let focusTick = null;
function focusState(){ return lsGet('focus', null); }
function openFocus(t){
  if (!t) return;
  if (extNivel() >= 5 && esTareaSeguimiento(t)){
    let f = focusState(); if (!f || f.row !== t.row) f = { row: t.row, tarea: t.tarea, dur: 25, fin: 0, resta: 25 * 60000 };
    if (!f.fin) f.fin = Date.now() + f.resta; lsSet('focus', f);
    return rondaSeguimiento(t);
  }
  openFocusTimer(t);
}
function openFocusTimer(t){
  if (!t) return;
  let f = focusState();
  if (!f || f.row !== t.row) f = { row: t.row, tarea: t.tarea, dur: 25, fin: 0, resta: 25 * 60000 };
  lsSet('focus', f);
  focusSheet();
}
function focusSheet(){
  const f = focusState(); if (!f) return;
  sheet('<h3>🎯 Modo foco</h3><div class="hint" style="font-size:15px;color:var(--ink);font-weight:700">' + esc(f.tarea) + '</div>' +
    '<div class="timer" id="fRing"></div>' +
    '<div class="seg" style="justify-content:center" id="fDur">' + [15, 25, 50].map(m => '<button type="button" class="pill ' + (f.dur === m ? 'on' : '') + '" data-v="' + m + '">' + m + ' min</button>').join('') + '</div>' +
    '<div class="btns"><button class="btn sec" id="fStop">⏹ Terminar</button><button class="btn" id="fGo"></button></div>' +
    '<div class="hint" style="text-align:center">Silencia el teléfono y haz solo esto. Al terminar te aviso con una vibración.</div>');
  const pintar = () => {
    const g = focusState(); if (!g) return;
    const resta = g.fin ? Math.max(0, g.fin - Date.now()) : g.resta, tot = g.dur * 60000;
    const mm = Math.floor(resta / 60000), ss = Math.floor(resta % 60000 / 1000);
    $('#fRing').innerHTML = ring(1 - resta / tot, 'url(#fg)', 'var(--soft)', 220).replace('</svg>', '<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5DFC"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient></defs></svg>') +
      '<b>' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0') + '<span>' + (g.fin ? 'enfocado…' : resta < tot ? 'en pausa' : 'listo para partir') + '</span></b>';
    $('#fGo').textContent = g.fin ? '⏸ Pausar' : resta < tot ? '▶ Seguir' : '▶ Comenzar';
    if (g.fin && resta <= 0) focusFin();
  };
  $$('#fDur .pill').forEach(b => b.onclick = () => { const g = focusState(); if (g.fin) return toast('Pausa primero para cambiar'); g.dur = +b.dataset.v; g.resta = g.dur * 60000; lsSet('focus', g); setPill('fDur', b.dataset.v); pintar(); });
  $('#fGo').onclick = () => { const g = focusState(); if (g.fin){ g.resta = Math.max(0, g.fin - Date.now()); g.fin = 0; } else g.fin = Date.now() + g.resta; lsSet('focus', g); pintar(); };
  $('#fStop').onclick = () => { LS.removeItem('focus'); closeSheet(); };
  pintar();
  if (focusTick) clearInterval(focusTick);
  focusTick = setInterval(pintar, 1000);
}
function focusFin(){
  const f = focusState(); if (!f) return;
  LS.removeItem('focus'); if (focusTick){ clearInterval(focusTick); focusTick = null; }
  vibrar([250, 120, 250, 120, 400]); confetti(40);
  const t = S.data && S.data.tareas.find(x => x.row === f.row);
  sheet('<h3>⏰ ¡Tiempo!</h3><div class="hint" style="font-size:15px">Terminaste ' + f.dur + ' minutos enfocado en <b>' + esc(f.tarea) + '</b>. ¿Cómo quedó?</div>' +
    '<div class="btns">' + (t && !t.hecho ? '<button class="btn" id="ffDone">✅ La terminé</button>' : '') + '<button class="btn sec" id="ffMore">▶ 5 min más</button></div>' +
    '<div class="btns"><button class="btn sec" id="ffClose">Tomar un descanso ☕</button></div>');
  if (t && !t.hecho) $('#ffDone').onclick = () => { closeSheet(); toggle(t); };
  $('#ffMore').onclick = () => { lsSet('focus', { row: f.row, tarea: f.tarea, dur: 5, fin: Date.now() + 5 * 60000, resta: 5 * 60000 }); focusSheet(); };
  $('#ffClose').onclick = closeSheet;
}
function focusPill(){
  const f = focusState(), b = $('#focusPill');
  if (!f || $('#layer').innerHTML){ b.hidden = true; return; }
  const resta = f.fin ? f.fin - Date.now() : f.resta;
  if (f.fin && resta <= 0){ b.hidden = true; return focusFin(); }
  b.hidden = false; b.textContent = (f.fin ? '⏱ ' : '⏸ ') + Math.ceil(resta / 60000) + ' min · ' + f.tarea;
  b.onclick = () => { const t = S.data && S.data.tareas.find(x => x.row === f.row && !x.hecho); if (t && extNivel() >= 5 && esTareaSeguimiento(t)) rondaSeguimiento(t); else focusSheet(); };
}
setInterval(() => { if (!$('#layer').innerHTML) focusPill(); }, 15000);

/* ---------- celebración ---------- */
function confetti(n){
  const cols = ['#6D5DFC','#FF5C8A','#FFB547','#13B386','#3B9EFF','#A44DF0'];
  for (let i = 0; i < (n || 36); i++){
    const s = document.createElement('i'); s.className = 'confetti';
    s.style.left = Math.random() * 100 + 'vw'; s.style.background = cols[i % cols.length];
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = Math.random() * .25 + 's'; s.style.animationDuration = (1.2 + Math.random() * .8) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

/* ---------- acciones ---------- */
async function toggle(t){
  if (!t) return;
  if (t.row == null){ toast('Espera a que se sincronice'); return; }
  const antes = { hecho: t.hecho, cierre: t.cierre };
  t.hecho = !t.hecho; t.cierre = t.hecho ? (hoy() + 'T' + new Date().toTimeString().slice(0, 5)) : '';
  if (t.hecho){ confetti(); vibrar(35); }
  render();
  try {
    await api('toggle', { row: t.row, tarea: t.tarea, hecho: t.hecho });
    if (t.hecho){ const n = hechasEl(hoy()).length, m = metaDiaria(); toast(n === m ? '🏆 ¡Meta del día cumplida!' : '¡Hecha! ✓ ' + n + '/' + m + ' hoy'); if (n === m) confetti(90); }
    const ng = t.hecho && extNivel() >= 5 && String(t.notas || '').match(/\((N-[a-z0-9]+)\)/);
    if (ng) apiX('negocioNota', { id: ng[1], texto: '✅ ' + t.tarea, tipo: '✅ Tarea' }).then(() => loadNeg(true)).catch(() => {});
    if (t.hecho && t.repetir && !S.extInactivo){
      try { const r = await apiX('siguiente', { row: t.row, tarea: t.tarea }); if (r.creada) toast('🔁 Lista la próxima: ' + fmtRel(r.fecha).toLowerCase()); }
      catch(e){ toast('No se pudo crear la siguiente: ' + e.message); }
    }
    load();
  }
  catch(e){ t.hecho = antes.hecho; t.cierre = antes.cierre; render(); toast('No se pudo guardar: ' + e.message); }
}

    '<div class="btns"><button class="btn bad" id="s_out">Desconectar este dispositivo</button></div>');
  if (deferredInstall) $('#s_inst').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeSheet(); };
  $('#s_g').onclick = () => g && !g.inactivo ? openSugerencias() : showExtrasSetup();
  const ss2 = $('#s_sinc'); if (ss2) ss2.onclick = async () => { ss2.disabled = true; try { const r = await apiX('sinc'); toast('📅 ' + r.creados + ' nuevos · ' + r.actualizados + ' actualizados · ' + r.borrados + ' borrados'); } catch(e){ toast('No se pudo: ' + e.message); } ss2.disabled = false; };
  const su = $('#s_upd'); if (su) su.onclick = showExtrasUpdate;
  const sim = $('#s_imp'); if (sim) sim.onclick = () => openImportar();
  const sbs = $('#s_bs'); if (sbs) sbs.onclick = () => openStock('');
  const sbc = $('#s_bsc'); if (sbc) sbc.onclick = async () => { sbc.disabled = true; sbc.innerHTML = '<span class="spin"></span>Actualizando…'; try { const r = await apiX('bsale', { sinc: 1 }); toast('📦 Catálogo actualizado: ' + r.catalogo + ' variantes'); await loadExtras(); } catch(e){ toast('No se pudo: ' + e.message); } sbc.disabled = false; sbc.textContent = '🔄 Actualizar catálogo'; };
  $('#s_re').onclick = showSetup;
  $('#s_out').onclick = () => { if (confirm('Se borran el link y la clave de este dispositivo.')){ ['url', 'token', 'cache', 'googleCache', 'extCache', 'baseCache', 'negCache'].forEach(k => LS.removeItem(k)); S.data = null; S.google = null; closeSheet(); showSetup(); } };
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('error', e => toast('Error: ' + (e.error && e.error.message || e.message)));
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message || e.reason)));
document.addEventListener('visibilitychange', () => { if (!document.hidden && LS.url && S.data){ load(); focusPill(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- inicio ---------- */
if (LS.cache) { try { S.data = JSON.parse(LS.cache); } catch(e){} }
S.google = lsGet('googleCache', null);
S.ext = lsGet('extCache', null);
S.base = lsGet('baseCache', null);
{ const c = lsGet('igCache', null); if (c){ S.ig = c.ig; S.cont = c.cont; } }
S.neg = lsGet('negCache', null);
if (!LS.url || !LS.token) { render(); showSetup(); } else { render(); load(); revisarCompartido(); }
</script>
</body>
