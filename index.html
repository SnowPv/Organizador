<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Organizador</title>
<style>
:root{
  --bg:#FAFAFC; --card:#FFFFFF; --ink:#1A1A2B; --muted:#8B8D9A; --line:#EDEDF2;
  --brand:#1A1A2B; --accent:#5B4FE0; --accent-ink:#FFFFFF; --ok:#1AA179; --warn:#B7791F; --bad:#D92D3B; --soft:#F5F4FA;
  --trabajo-bg:#EDE9FE; --trabajo-ink:#4C3FA8; --personal-bg:#FCE4EC; --personal-ink:#9D2359;
  --shadow-sm:0 1px 2px rgba(20,20,43,.05), 0 1px 1px rgba(20,20,43,.03);
  --shadow-md:0 8px 24px -8px rgba(20,20,43,.16);
  --shadow-fab:0 10px 24px -6px rgba(91,79,224,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{padding-bottom:24px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%, transparent);backdrop-filter:blur(6px);padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
header.top small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow-sm);width:38px;height:38px;border-radius:12px;font-size:16px;color:var(--ink)}
.chip-off{background:#FDF0E4;color:#B7591F;border-radius:999px;padding:3px 10px;font-size:11px;margin-left:8px;font-weight:600;vertical-align:middle}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow-sm)}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:100px;height:100px;flex:none}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:23px;font-weight:800;letter-spacing:-.02em}
.ring b span{font-size:11px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.stat{background:var(--soft);border-radius:14px;padding:9px 11px}
.stat b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.bar u{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.4}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #D9D8E3;background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;transition:background .15s,border-color .15s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.task .t{font-weight:600;line-height:1.3;word-break:break-word;letter-spacing:-.005em}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:99px;font-weight:600}
.tag.bad{background:#FBE3E5;color:#A81D2B}.tag.warn{background:#FBF0DA;color:#8A5A10}.tag.ok{background:#DEF3EA;color:#0F7A56}
.tag.area-Trabajo{background:var(--trabajo-bg);color:var(--trabajo-ink)}.tag.area-Personal{background:var(--personal-bg);color:var(--personal-ink)}
.empty{text-align:center;color:var(--muted);padding:26px 6px;font-size:14px;font-weight:500}
nav.bottom{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:20px;padding:7px 3px;display:flex;justify-content:space-around;z-index:8;box-shadow:var(--shadow-md);border:1px solid rgba(20,20,43,.04)}
nav.bottom button{flex:1;border:0;background:none;padding:5px 1px;color:var(--muted);font-size:9.5px;font-weight:600;border-radius:13px}
nav.bottom button span{display:block;font-size:17px;line-height:1.3}
nav.bottom button.on{color:var(--accent);background:var(--soft)}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;font-weight:300;line-height:1;box-shadow:var(--shadow-fab);z-index:9;transition:transform .12s}
.fab:active{transform:scale(.93)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.l{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;background:var(--accent);color:#fff;font-size:15.5px;box-shadow:0 4px 14px -4px rgba(91,79,224,.5)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.bad{background:transparent;color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;margin-top:18px}.btns .btn{flex:1}
.backdrop{position:fixed;inset:0;background:rgba(20,20,35,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:40px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;font-size:14px;font-weight:600;max-width:88%;box-shadow:var(--shadow-md)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border-radius:16px;padding:11px;box-shadow:var(--shadow-sm)}
.kpi b{font-size:21px;display:block;font-weight:800;letter-spacing:-.01em}.kpi span{font-size:11px;color:var(--muted);font-weight:600}
.hb{margin:10px 0}.hb .n{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:500}
.hb .b{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--soft)}
.hb .b i{display:block;height:100%}
.filters{display:flex;gap:6px;overflow:auto;padding:4px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.4}
svg text{fill:var(--muted);font-size:9px}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px}
.badge{flex:none;width:72px;text-align:center;padding:10px 4px;border-radius:16px;background:var(--soft);opacity:.5}
.badge.on{opacity:1;box-shadow:0 6px 16px -6px rgba(91,79,224,.35)}
.badge .ic{font-size:26px;display:block;margin-bottom:4px}
.badge .nm{font-size:10px;font-weight:700;line-height:1.2;color:var(--ink)}
.badge.on .nm{color:var(--accent)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qc{border-radius:16px;padding:12px;color:#fff}
.qc b{font-size:24px;display:block;font-weight:800}
.qc span{font-size:11.5px;font-weight:600;opacity:.92;display:block;margin-top:2px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.heat i{display:block;padding-top:100%;border-radius:4px;background:var(--soft);position:relative}
.heat i.today{box-shadow:0 0 0 2px var(--ink) inset}
.habit-row{padding:14px 0;border-top:1px solid var(--line)}
.habit-row:first-of-type{border-top:0}
.habit-dot{width:12px;height:12px;border-radius:50%;flex:none}
.checklist-item{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.checklist-item:first-of-type{border-top:0}
.checklist-item.done .ct{text-decoration:line-through;color:var(--muted)}
.energy{font-size:15px}
.weekcard{border-radius:16px;padding:12px;background:var(--soft);margin:8px 0}
textarea.note{min-height:56px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="hTitle">Organizador</h1><small id="hSub"></small></div>
    <div class="row" style="gap:8px">
      <button class="icon-btn" id="btnRefresh" title="Actualizar">↻</button>
      <button class="icon-btn" id="btnSettings" title="Ajustes">⚙</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Agregar tarea">+</button>
<nav class="bottom">
  <button data-tab="hoy"><span>☀</span>Hoy</button>
  <button data-tab="tareas"><span>☰</span>Tareas</button>
  <button data-tab="habitos"><span>💪</span>Hábitos</button>
  <button data-tab="semana"><span>🗓</span>Semana</button>
  <button data-tab="dash"><span>▥</span>Dashboard</button>
  <button data-tab="proy"><span>⚑</span>Proyectos</button>
</nav>
<div id="layer"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS = window.localStorage;
let S = { data: null, tab: 'hoy', filtro: 'todas', q: '', verHechas: false, offline: false, busy: false };
let deferredInstall = null;

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function pd(s){ return new Date(s + 'T12:00:00'); }
function addDays(s, n){ const d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmt(s){ if(!s) return 'Sin fecha'; const d = pd(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; }
function hoy(){ return (S.data && S.data.hoy) || iso(new Date()); }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function pct(x){ return Math.round((x || 0) * 100); }
const PALETTE = ['#5B4FE0','#E0574F','#1AA179','#D9A62E','#2E86D9','#C24FBF','#E0824F','#2EA8A0','#B5539A','#4F8FE0'];
function paletteColor(s){ s = String(s||''); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
function hexToRgba(hex, a){ const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
function metaDiaria(){ return +((S.data.config.params || {})['Meta diaria de tareas']) || 6; }
function achievements(){
  const ind = S.data.indicadores || {}, T = S.data.tareas;
  const racha = +ind[Object.keys(ind).find(k => k.startsWith('Racha'))] || 0;
  const puntos = +ind['Puntos totales'] || 0;
  const hechasHoy = +ind['Hechas hoy'] || 0;
  return [
    { ic: '🌱', nm: 'Primera tarea', on: T.some(t => t.hecho) },
    { ic: '🎯', nm: 'Meta de hoy', on: hechasHoy >= metaDiaria() },
    { ic: '🔥', nm: 'Racha de 3', on: racha >= 3 },
    { ic: '⚡', nm: 'Racha de 10', on: racha >= 10 },
    { ic: '💯', nm: '100 puntos', on: puntos >= 100 },
    { ic: '🏆', nm: '500 puntos', on: puntos >= 500 }
  ];
}
function quadrantCounts(){
  const c = { 1: 0, 2: 0, 3: 0, 4: 0 };
  S.data.tareas.forEach(t => { if (t.hecho) return; const n = parseInt(t.cuadrante); if (c[n] != null) c[n]++; });
  return c;
}
function areaSummary(){
  const m = {};
  S.data.tareas.forEach(t => { const a = t.area || 'Sin área'; m[a] = m[a] || { total: 0, hechas: 0 }; m[a].total++; if (t.hecho) m[a].hechas++; });
  return m;
}

/* ---------- API ---------- */
async function api(action, extra){
  let res;
  res = await fetch(LS.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: LS.token, action }, extra || {})) });
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('respuesta'); }
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
async function load(){
  S.busy = true; head();
  try {
    S.data = await api('state'); LS.cache = JSON.stringify(S.data); S.offline = false;
  } catch(e){
    if (e.message === 'auth'){ toast('La clave no coincide'); S.busy = false; return showSetup(); }
    S.offline = true;
    if (!S.data && LS.cache) S.data = JSON.parse(LS.cache);
  }
  S.busy = false; render();
}

/* ---------- cabecera y navegación ---------- */
function head(){
  const titles = { hoy: 'Hoy', tareas: 'Tareas', habitos: 'Hábitos', semana: 'Semana', dash: 'Dashboard', proy: 'Proyectos' };
  $('#hTitle').innerHTML = titles[S.tab] + (S.offline ? '<span class="chip-off">sin conexión</span>' : '');
  $('#hSub').innerHTML = S.busy ? '<span class="spin"></span>Actualizando…' : fmtLong(hoy());
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
}
function fmtLong(s){ const d = pd(s); const n = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]; return n + ' ' + d.getDate() + ' de ' + ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]; }
document.querySelectorAll('nav.bottom button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0,0); });
$('#btnRefresh').onclick = () => load();
$('#btnSettings').onclick = () => showSettings();
$('#fab').onclick = () => { try { openAdd(); } catch(e){ toast('No se pudo abrir el formulario: ' + e.message); } };

function render(){
  head();
  if (!S.data){ $('#view').innerHTML = '<div class="empty"><span class="spin"></span>Cargando…</div>'; return; }
  ({ hoy: viewHoy, tareas: viewTareas, habitos: viewHabitos, semana: viewSemana, dash: viewDash, proy: viewProy })[S.tab]();
}

/* ---------- componentes ---------- */
function ordenar(a, b){
  const ca = parseInt(a.cuadrante) || 9, cb = parseInt(b.cuadrante) || 9;
  if (ca !== cb) return ca - cb;
  return (a.limite || '9999').localeCompare(b.limite || '9999');
}
function tagAlerta(t){
  if (t.hecho) return '<span class="tag ok">Hecha</span>';
  const h = hoy();
  if (!t.limite) return '';
  if (t.limite < h) return '<span class="tag bad">Vencida · ' + fmt(t.limite) + '</span>';
  if (t.limite === h) return '<span class="tag warn">Hoy</span>';
  return '<span class="tag">' + fmt(t.limite) + '</span>';
}
function taskHTML(t){
  const idx = S.data.tareas.indexOf(t);
  return '<div class="task ' + (t.hecho ? 'done' : '') + '">' +
    '<button class="chk ' + (t.hecho ? 'on' : '') + '" data-tog="' + idx + '" aria-label="Marcar">' + (t.hecho ? '✓' : '') + '</button>' +
    '<div class="grow" data-open="' + idx + '"><div class="t">' + esc(t.tarea) + '</div><div class="meta">' + tagAlerta(t) +
    (t.area ? '<span class="tag area-' + esc(t.area) + '">' + esc(t.area) + '</span>' : '') +
    (t.categoria ? '<span class="tag" style="background:' + hexToRgba(paletteColor(t.categoria), .14) + ';color:' + paletteColor(t.categoria) + '">' + esc(t.categoria) + '</span>' : '') +
    (t.proyecto ? '<span class="tag">⚑ ' + esc(t.proyecto) + '</span>' : '') +
    (t.estado && t.estado !== 'Pendiente' && !t.hecho ? '<span class="tag">' + esc(t.estado) + '</span>' : '') +
    '</div></div></div>';
}
function bindTasks(root){
  root.querySelectorAll('[data-tog]').forEach(b => b.onclick = e => { e.stopPropagation(); toggle(S.data.tareas[+b.dataset.tog]); });
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(S.data.tareas[+b.dataset.open]));
}
function ring(p, color){
  const r = 42, c = 2 * Math.PI * r;
  return '<svg viewBox="0 0 104 104" width="104" height="104"><circle cx="52" cy="52" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="10"/>' +
    '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="' + (color || 'var(--ok)') + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * Math.min(1, p)).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 52 52)"/></svg>';
}
function projCard(p){
  const av = Math.min(1, p.avance || 0), ti = p.tiempo;
  return '<div class="card"><div class="row"><div class="grow"><b>' + esc(p.nombre) + '</b><div class="hint" style="margin:2px 0 0">' + esc(p.objetivo || '') + '</div></div><span class="tag">' + esc(p.ritmo || '') + '</span></div>' +
    '<div class="bar" style="margin:10px 0 6px"><i style="width:' + pct(av) + '%"></i>' + (ti != null ? '<u style="left:calc(' + pct(ti) + '% - 1px)"></u>' : '') + '</div>' +
    '<div class="row hint" style="justify-content:space-between"><span>' + pct(av) + '% avance · ' + p.hechas + '/' + p.tareas + ' tareas</span><span>' + (p.dias != null ? (p.dias >= 0 ? p.dias + ' días' : 'vencido') : '') + '</span></div>' +
    (p.resultado ? '<div class="hint">🎯 ' + esc(p.resultado) + '</div>' : '') + '</div>';
}

/* ---------- vista: Hoy ---------- */
function viewHoy(){
  const d = S.data, h = hoy(), T = d.tareas, ind = d.indicadores || {};
  const lista = T.filter(t => !t.hecho && ((t.limite && t.limite <= h) || t.estado === 'En curso')).sort(ordenar);
  const hechasHoy = T.filter(t => t.hecho && (t.cierre || '').slice(0, 10) === h);
  const prox = T.filter(t => !t.hecho && t.limite > h && t.limite <= addDays(h, 7)).sort(ordenar);
  const total = lista.length + hechasHoy.length, p = total ? hechasHoy.length / total : 0;
  const meta = +((d.config.params || {})['Meta diaria de tareas']) || 6;
  const nombre = (d.config.params || {})['Tu nombre (para el saludo)'];
  const hr = new Date().getHours(), saludo = hr < 12 ? 'Buenos días' : hr < 20 ? 'Buenas tardes' : 'Buenas noches';
  const racha = ind[Object.keys(ind).find(k => k.startsWith('Racha'))] || 0;
  const puntos = ind['Puntos totales'] || 0, nivel = ind['Nombre del nivel'] || '', enNivel = +ind['Puntos dentro del nivel actual'] || 0;
  const paraNivel = +((d.config.params || {})['Puntos para subir de nivel']) || 100;
  let html = '<div class="card"><div class="hero"><div class="ring">' + ring(p) + '<b>' + hechasHoy.length + '<span>de ' + total + '</span></b></div>' +
    '<div class="stats"><div class="stat"><b>' + esc(racha) + '</b><span>racha (días)</span></div><div class="stat"><b>' + esc(puntos) + '</b><span>puntos</span></div>' +
    '<div class="stat"><b>' + hechasHoy.length + '/' + meta + '</b><span>meta diaria</span></div><div class="stat"><b>' + esc(nivel) + '</b><span>nivel</span></div></div></div>' +

/* ---------- vista: Dashboard ---------- */
function chartDias(dias){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 150, pad = 18, n = dias.length, bw = (W - pad * 2) / n;
  const max = Math.max(4, ...dias.map(x => x.completadas), ...dias.map(x => x.meta));
  const y = v => H - 22 - (v / max) * (H - 40);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  dias.forEach((x, i) => {
    const bx = pad + i * bw + 3, bh = (H - 22) - y(x.completadas);
    s += '<rect x="' + bx + '" y="' + y(x.completadas) + '" width="' + (bw - 6) + '" height="' + Math.max(0, bh) + '" rx="3" fill="' + (x.completadas >= x.meta && x.meta > 0 ? 'var(--ok)' : 'var(--accent)') + '"/>';
    if (x.completadas) s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (y(x.completadas) - 3) + '" text-anchor="middle">' + x.completadas + '</text>';
    s += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + pd(x.fecha).getDate() + '</text>';
  });
  const meta = dias[dias.length - 1].meta;
  if (meta) s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(meta) + '" y2="' + y(meta) + '" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/><text x="' + (W - pad) + '" y="' + (y(meta) - 3) + '" text-anchor="end">meta ' + meta + '</text>';
  return s + '</svg>';
}
function chartLine(dias, key, color){
  if (!dias.length) return '<div class="empty">Aún no hay datos.</div>';
  const W = 340, H = 130, pad = 18, n = dias.length;
  const vals = dias.map(x => x[key] || 0), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const x = i => pad + i * (W - pad * 2) / Math.max(1, n - 1);
  const y = v => H - 20 - ((v - min) / (max - min || 1)) * (H - 34);
  let pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  let area = 'M' + x(0) + ',' + (H - 20) + ' L' + pts.replace(/ /g, ' L').slice(1) + ' L' + x(n - 1) + ',' + (H - 20) + ' Z';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  s += '<path d="' + area + '" fill="' + hexToRgba(color, .14) + '" stroke="none"/>';
  s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  dias.forEach((d, i) => { if (i === n - 1 || i % Math.ceil(n / 6) === 0) s += '<text x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="middle">' + pd(d.fecha).getDate() + '</text>'; });
  s += '<circle cx="' + x(n - 1) + '" cy="' + y(vals[n - 1]) + '" r="4" fill="' + color + '"/>';
  return s + '</svg>';
}

  html += '<div class="card"><h2>Proyectos · avance vs tiempo</h2>' + (d.proyectos.length ? d.proyectos.map(p => '<div class="hb"><div class="n"><span>' + esc(p.nombre) + '</span><span>' + pct(p.avance) + '% · ' + esc(p.ritmo || '') + '</span></div><div class="bar"><i style="width:' + pct(Math.min(1, p.avance)) + '%;background:' + paletteColor(p.nombre) + '"></i>' + (p.tiempo != null ? '<u style="left:calc(' + pct(p.tiempo) + '% - 1px)"></u>' : '') + '</div></div>').join('') + '<div class="hint">La línea negra marca el tiempo transcurrido del proyecto.</div>' : '<div class="empty">Aún no hay proyectos.</div>') + '</div>';

  if (!t || t.row == null){ toast('Espera a que se sincronice'); return; }
  const c = S.data.config;
  sheet('<h3>Editar tarea</h3>' +
    '<label class="l">Tarea</label><input type="text" id="e_t" value="' + esc(t.tarea) + '">' +
    '<label class="l">Estado</label><select id="e_est">' + c.estados.map(x => '<option' + (x === t.estado ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' +
    '<label class="l">Fecha límite</label><input type="date" id="e_f" value="' + esc(t.limite) + '">' +
    '<div class="seg" style="margin-top:8px"><button type="button" class="pill" id="e_hoy">Hoy</button><button type="button" class="pill" id="e_man">Mañana</button><button type="button" class="pill" id="e_lun">Lunes</button><button type="button" class="pill" id="e_sin">Sin fecha</button></div>' +
    '<label class="l">Urgente</label>' + pills('e_urg', [{ v: 'Sí', t: 'Sí' }, { v: 'No', t: 'No' }], t.urgente) +
    '<label class="l">Importante</label>' + pills('e_imp', [{ v: 'Sí', t: 'Sí' }, { v: 'No', t: 'No' }], t.importante) +
    '<label class="l">Tamaño</label>' + pills('e_tam', c.tamanos.map(x => ({ v: x.nombre, t: x.nombre })), t.tamano) +
    '<label class="l">Notas</label><input type="text" id="e_n" value="' + esc(t.notas) + '">' +
    '<div class="hint">' + esc(t.area) + (t.categoria ? ' · ' + esc(t.categoria) : '') + (t.proyecto ? ' · ⚑ ' + esc(t.proyecto) : '') + '</div>' +
    '<div class="btns"><button class="btn bad" id="e_del">Eliminar</button><button class="btn" id="e_ok">Guardar</button></div>');
  bindPills('e_urg'); bindPills('e_imp'); bindPills('e_tam');
  const h = hoy();
  $('#e_hoy').onclick = () => $('#e_f').value = h; $('#e_man').onclick = () => $('#e_f').value = addDays(h, 1);
  $('#e_lun').onclick = () => $('#e_f').value = nextMonday(h); $('#e_sin').onclick = () => $('#e_f').value = '';
  $('#e_ok').onclick = async () => {
    const campos = { nuevoTexto: $('#e_t').value.trim(), estado: $('#e_est').value, limite: $('#e_f').value, urgente: val('e_urg'), importante: val('e_imp'), tamano: val('e_tam'), notas: $('#e_n').value.trim() };
    $('#e_ok').disabled = true;
    try { await api('update', { row: t.row, tarea: t.tarea, campos }); closeSheet(); toast('Guardado ✓'); await load(); }
    catch(e){ $('#e_ok').disabled = false; toast('No se pudo guardar: ' + e.message); }
  };
  $('#e_del').onclick = async () => {
    if (!confirm('¿Eliminar esta tarea?')) return;
    try { await api('delete', { row: t.row, tarea: t.tarea }); closeSheet(); toast('Eliminada'); await load(); }
    catch(e){ toast('No se pudo eliminar: ' + e.message); }
  };
}

function openProyecto(){
  const c = S.data.config, h = hoy();
  let area = c.areas[0] || 'Trabajo';
  const catsDe = a => c.categorias.filter(x => x.area === a);
  sheet('<h3>Nuevo proyecto</h3>' +
    '<label class="l">Nombre</label><input type="text" id="p_n" placeholder="Ej.: Campaña de temporada">' +
    '<label class="l">Área</label>' + pills('p_area', c.areas.map(a => ({ v: a, t: a })), area) +
    '<label class="l">Categoría</label><select id="p_cat"></select>' +
    '<label class="l">Objetivo</label><input type="text" id="p_o" placeholder="¿Qué quieres lograr?">' +
    '<label class="l">Resultado clave (medible)</label><input type="text" id="p_r" placeholder="Ej.: 10 ventas cerradas">' +
    '<label class="l">Inicio</label><input type="date" id="p_i" value="' + h + '">' +
    '<label class="l">Fin</label><input type="date" id="p_f" value="' + addDays(h, 60) + '">' +
    '<div class="btns"><button class="btn" id="p_ok">Crear proyecto</button></div>');
  const fill = () => { $('#p_cat').innerHTML = '<option value="">— sin categoría —</option>' + catsDe(area).map(x => '<option>' + esc(x.nombre) + '</option>').join(''); };
  fill(); bindPills('p_area', v => { area = v; fill(); });
  setTimeout(() => $('#p_n').focus(), 60);
  $('#p_ok').onclick = async () => {
    const n = $('#p_n').value.trim(); if (!n){ toast('Ponle un nombre'); return; }
    $('#p_ok').disabled = true;
    try { await api('addProject', { proyecto: { nombre: n, area, categoria: $('#p_cat').value, objetivo: $('#p_o').value.trim(), resultado: $('#p_r').value.trim(), inicio: $('#p_i').value, fin: $('#p_f').value } }); closeSheet(); toast('Proyecto creado ✓'); await load(); }
    catch(e){ $('#p_ok').disabled = false; toast('No se pudo crear: ' + e.message); }
  };
}

/* ---------- acciones ---------- */
async function toggle(t){
  if (!t) return;
  if (t.row == null){ toast('Espera a que se sincronice'); return; }
  const antes = { hecho: t.hecho, cierre: t.cierre };
  t.hecho = !t.hecho; t.cierre = t.hecho ? (hoy() + 'T' + new Date().toTimeString().slice(0, 5)) : '';
  render();
  try { await api('toggle', { row: t.row, tarea: t.tarea, hecho: t.hecho }); if (t.hecho) toast('¡Hecha! ✓'); load(); }
  catch(e){ t.hecho = antes.hecho; t.cierre = antes.cierre; render(); toast('No se pudo guardar: ' + e.message); }
}

/* ---------- configuración inicial y ajustes ---------- */
function showSetup(){
  sheet('<h3>Conectar con tu Sheet</h3><div class="hint">Pega el link de tu aplicación web (termina en /exec) y la clave que pusiste en el script.</div>' +
    '<label class="l">Link de la aplicación web</label><input type="url" id="s_url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(LS.url || '') + '">' +
    '<label class="l">Clave</label><input type="password" id="s_tok" value="' + esc(LS.token || '') + '">' +
    '<div class="btns"><button class="btn" id="s_ok">Conectar</button></div>');
  $('#s_ok').onclick = async () => {
    const url = $('#s_url').value.trim(), tok = $('#s_tok').value;
    if (!url || !tok){ toast('Faltan datos'); return; }
    LS.url = url; LS.token = tok; $('#s_ok').disabled = true; $('#s_ok').textContent = 'Conectando…';
    try { S.data = await api('state'); LS.cache = JSON.stringify(S.data); closeSheet(); render(); toast('Conectado ✓'); }
    catch(e){ $('#s_ok').disabled = false; $('#s_ok').textContent = 'Conectar'; toast(e.message === 'auth' ? 'La clave no coincide' : 'No se pudo conectar. Revisa el link.'); }
  };
}
function showSettings(){
  sheet('<h3>Ajustes</h3><div class="hint">Conectado a tu Sheet del organizador.</div>' +
    (deferredInstall ? '<div class="btns"><button class="btn" id="s_inst">Instalar app en este dispositivo</button></div>' : '') +
    '<div class="btns"><button class="btn sec" id="s_re">Cambiar link o clave</button></div>' +
    '<div class="btns"><button class="btn bad" id="s_out">Desconectar este dispositivo</button></div>');
  if (deferredInstall) $('#s_inst').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeSheet(); };
  $('#s_re').onclick = showSetup;
  $('#s_out').onclick = () => { if (confirm('Se borran el link y la clave de este dispositivo.')){ delete LS.url; delete LS.token; delete LS.cache; S.data = null; closeSheet(); showSetup(); } };
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('error', e => toast('Error: ' + (e.error && e.error.message || e.message)));
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message || e.reason)));
document.addEventListener('visibilitychange', () => { if (!document.hidden && LS.url && S.data) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- inicio ---------- */
if (LS.cache) { try { S.data = JSON.parse(LS.cache); } catch(e){} }
if (!LS.url || !LS.token) { render(); showSetup(); } else { render(); load(); }
</script>
</body>
</html>
